# Scratch PostgreSQL for the test suite.
#   docker compose -f docker-compose.test.yml up -d
# Then run the tests (they default to this instance):
#   python tests/test_api.py
#   python tests/test_ui.py
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: familytree
      POSTGRES_PASSWORD: familytree
      POSTGRES_DB: familytree_test
    ports:
      - "5433:5432"
    tmpfs:
      # postgres:18 keeps its data under /var/lib/postgresql/18/docker
      - /var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1: the image's init-time temporary server only listens on
      # the unix socket, so this doesn't report ready before the real start.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U familytree -d familytree_test"]
      interval: 2s
      timeout: 3s
      retries: 15
