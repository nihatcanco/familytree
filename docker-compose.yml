# Production stack: the app + its PostgreSQL, deployed by the Jenkinsfile (see
# DEPLOY.md). The app serves plain HTTP on host port APP_PORT; put an HTTPS
# reverse proxy in front of it for anything beyond a trusted LAN.
#
# Needs POSTGRES_PASSWORD in the environment (Jenkins injects it from the
# 'familytree-postgres-password' credential). Keep it alphanumeric: it is
# embedded in the connection URL as-is. Postgres itself only applies it when
# the pgdata volume is first created; the Jenkins Deploy stage re-applies it
# to the role on every deploy (sync-db-password.sql).
#
# Optional: APP_PORT (default 8000), APP_BIND (default: every interface),
# FAMILYTREE_SECURE_COOKIES, FAMILYTREE_ADMIN_USERNAME / _PASSWORD.
#
# Manual use (from the repo dir):
#   POSTGRES_PASSWORD=... docker compose up -d --build
name: familytree

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: familytree
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: familytree
    volumes:
      # postgres:18 keeps its data under /var/lib/postgresql/18/docker
      - pgdata:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1: the image's init-time temporary server only listens on
      # the unix socket, so this doesn't report ready before the real start.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U familytree -d familytree"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    image: familytree:latest
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FAMILYTREE_DATABASE_URL: postgresql://familytree:${POSTGRES_PASSWORD}@db/familytree
      # Plain HTTP by default, so the session cookie can't be Secure (logins
      # wouldn't stick). Set to 1 once an HTTPS proxy is in front of it.
      FAMILYTREE_SECURE_COOKIES: ${FAMILYTREE_SECURE_COOKIES:-0}
      # Only read when no account exists yet (first start on an empty db).
      FAMILYTREE_ADMIN_USERNAME: ${FAMILYTREE_ADMIN_USERNAME:-admin}
      FAMILYTREE_ADMIN_PASSWORD: ${FAMILYTREE_ADMIN_PASSWORD:-}
    ports:
      # Host port APP_PORT (default 8000) -> server.py's 8000 in the container,
      # on every interface, or only on APP_BIND when that is set (e.g. 127.0.0.1
      # behind a reverse proxy on the same machine). Jenkins sets both and
      # smoke-checks the result.
      - "${APP_BIND:+${APP_BIND}:}${APP_PORT:-8000}:8000"

volumes:
  pgdata:
