<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLite Family Tree Viewer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons via reliable CDN -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <!-- sql.js for SQLite in the browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.min.js"></script>

    <style>
        /* --- CSS for the Tree Layout --- */
        .tree-container {
            display: inline-block;
            /* Removed min-width: 100% to allow exact unscaled width calculations */
        }
        .tree-container ul {
            padding-top: 20px; 
            position: relative;
            display: flex; 
            justify-content: center;
            padding-left: 0;
        }
        .tree-container li {
            text-align: center; 
            list-style-type: none;
            position: relative;
            padding: 0 10px 0 10px; /* Remove top padding, space will be handled by margin */
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }

        /* Connector lines */
        .tree-container li::before, .tree-container li::after {
            content: '';
            position: absolute;
            top: 0;
            right: 50%;
            border-top: 2px solid #94a3b8;
            width: 50%; 
            height: 20px;
            z-index: 0;
        }
        .tree-container li::after {
            right: auto; 
            left: 50%; 
        }

        /* Clean up connector lines for edge cases */
        .tree-container li:first-child::before,
        .tree-container li.visual-first-child::before,
        .tree-container li:last-child::after,
        .tree-container li.visual-last-child::after {
            border: 0 none;
        }
        .tree-container li:last-child::before,
        .tree-container li.visual-last-child::before {
            border-radius: 0;
        }
        .tree-container li:first-child::after,
        .tree-container li.visual-first-child::after {
            border-radius: 0;
        }

        /* Keep consistent margin for only-child by drawing a direct vertical connector */
        .tree-container li:only-child::before,
        .tree-container li.visual-only-child::before {
            display: none;
        }
        .tree-container li:only-child::after,
        .tree-container li.visual-only-child::after {
            display: none;
        }

        /* Focus Mode */
        .focus-hidden {
            display: none !important;
        }
        
        /* Hide parent connection lines when parent is hidden in focus mode */
        .hide-parent-lines::before {
            display: none !important;
        }
        .hide-parent-lines > li > .generation-wrapper::before {
            display: none !important;
        }

        /* Downward line from parent to children */
        .tree-container ul ul::before {
            content: ''; 
            position: absolute; 
            top: 0;
            left: calc(50% - 1px);
            border-left: 2px solid #94a3b8; 
            width: 0; 
            height: 20px;
        }

        /* Connect generation group to parents (upward line, non-root nodes only) */
        .tree-container ul ul li > .generation-wrapper::before {
            content: '';
            position: absolute;
            top: -20px; /* Go up into the li's padding-top */
            height: var(--line-height, 60px); /* Dynamically set via JS to perfectly touch marriage lines */
            left: calc(50% - 1px);
            border-left: 2px solid #94a3b8;
            z-index: 0;
        }

        .generation-wrapper {
            /* Add margin to create space for the connector lines above */
            margin-top: 20px;
        }

        /* Node card transitions */
        .tree-node-card {
            transition: all 0.2s ease-in-out;
        }
        .tree-node-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        .tree-node-card.highlighted {
            border-color: #3b82f6; /* Tailwind blue-500 */
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.3);
        }
        .tree-node-card.highlighted-gen {
            border-color: var(--highlight-color);
            box-shadow: var(--highlight-shadow);
        }

        /* Hide Scrollbars */
        .custom-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .custom-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        /* Multi-root layout */
        .roots-container {
            display: flex;
            gap: 4rem;
            align-items: flex-start;
            justify-content: center;
        }

        /* Search Matches */
        .tree-node-card.search-match {
            outline: 3px solid #f59e0b;
            outline-offset: 2px;
        }

    </style>
</head>
<body class="w-full h-screen bg-slate-50 font-sans text-slate-800 m-0 overflow-hidden relative flex bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] select-none">

    <!-- Main Tree Content -->
    <div class="flex-1 relative h-full overflow-hidden">
        <!-- Error Overlay -->
        <div id="error-overlay" class="hidden absolute top-4 left-1/2 -translate-x-1/2 z-50 bg-red-50 text-red-600 px-6 py-4 rounded-xl shadow-lg border border-red-200 flex items-center gap-3 max-w-2xl">
            <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0"></i>
            <span id="error-text" class="break-words w-full text-sm font-medium"></span>
        </div>

        <!-- Tree Canvas area -->
        <div id="scroll-container" class="w-full h-full overflow-auto p-8 custom-scrollbar cursor-grab">
            <!-- The explicit scale wrapper that prevents scroll clipping -->
            <div id="scale-wrapper" class="mx-auto relative" style="width: auto; height: auto;">
                <div 
                    id="tree-transform"
                    class="tree-container absolute top-0 left-0 w-max"
                    style="transform-origin: top left; transform: scale(1);"
                >
                    <div id="tree-root" class="w-max mx-auto">
                        <!-- Tree will be rendered here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Right Sidebar for Controls & Legend -->
    <div class="w-[180px] h-full bg-slate-50/95 backdrop-blur border-l border-slate-200 shadow-xl flex flex-col p-4 z-20 shrink-0">
        
        <!-- Toolbar -->
        <div class="flex bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden items-center justify-center mb-4 shrink-0">
            <button id="btn-zoom-out" class="p-2 hover:bg-slate-100 text-slate-600 transition-colors cursor-pointer flex-1 flex justify-center" title="Zoom Out">
                <i data-lucide="zoom-out" class="w-5 h-5"></i>
            </button>
            <button id="btn-zoom-reset" class="p-2 hover:bg-slate-100 text-slate-600 border-x border-slate-200 transition-colors cursor-pointer flex-1 flex justify-center" title="Reset Zoom">
                <i data-lucide="maximize" class="w-5 h-5"></i>
            </button>
            <button id="btn-zoom-in" class="p-2 hover:bg-slate-100 text-slate-600 transition-colors cursor-pointer flex-1 flex justify-center" title="Zoom In">
                <i data-lucide="zoom-in" class="w-5 h-5"></i>
            </button>
            <button id="btn-focus" class="p-2 hover:bg-slate-100 text-slate-600 border-l border-slate-200 transition-colors cursor-pointer flex-1 flex justify-center" title="Focus">
                <i data-lucide="focus" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Search -->
        <div class="flex bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden items-center justify-center mb-6 shrink-0">
            <input type="text" id="search-input" placeholder="Ara..." class="w-full px-3 py-2 text-sm outline-none bg-transparent placeholder-slate-400 text-slate-700">
            <button id="btn-search-clear" class="p-2 hover:bg-slate-100 text-slate-400 hover:text-slate-600 transition-colors cursor-pointer hidden justify-center shrink-0" title="Temizle">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
            <button id="btn-search-prev" class="p-2 hover:bg-slate-100 text-slate-600 border-l border-slate-200 transition-colors cursor-pointer flex justify-center shrink-0" title="Önceki Sonuç">
                <i data-lucide="chevron-up" class="w-4 h-4"></i>
            </button>
            <button id="btn-search-next" class="p-2 hover:bg-slate-100 text-slate-600 border-l border-slate-200 transition-colors cursor-pointer flex justify-center shrink-0" title="Sonraki Sonuç">
                <i data-lucide="chevron-down" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Person Details Panel -->
        <div id="person-details-panel" class="bg-white rounded-lg shadow-sm border border-slate-200 p-3 hidden flex-col shrink-0 mb-4">
            <div class="font-semibold text-slate-700 text-[11px] uppercase tracking-wider mb-2 pb-2 border-b border-slate-200 flex justify-between items-center shrink-0">
                <span>Kişi Detayları</span>
                <div class="flex items-center gap-1.5">
                    <button id="btn-close-details" class="p-1 -mr-1 hover:bg-slate-100 text-slate-400 hover:text-slate-600 rounded transition-colors cursor-pointer" title="Kapat">
                        <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            </div>
            <div id="person-details-content" class="flex flex-col gap-2 text-xs text-slate-600">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Generation Color Legend -->
        <div id="generation-legend" class="bg-white rounded-lg shadow-sm border border-slate-200 p-3 hidden flex-col flex-1 min-h-0 overflow-hidden">
            <div class="font-semibold text-slate-700 text-[11px] uppercase tracking-wider mb-2 pb-2 border-b border-slate-200 flex justify-between items-center shrink-0">
                <span>Nesiller</span>
            </div>
            <div id="legend-list" class="flex flex-col gap-2 text-xs text-slate-600 overflow-y-auto custom-scrollbar pr-1 pb-1">
                <!-- Populated by JS -->
            </div>
            <div id="legend-note" class="mt-2 pt-2 border-t border-slate-200 text-[10px] text-slate-400 text-center italic hidden shrink-0">
                16+ başa döner
            </div>
        </div>
        
        <!-- Minimap -->
        <div id="minimap-wrapper" class="bg-white rounded-lg shadow-sm border border-slate-200 p-3 hidden flex-col shrink-0 h-[180px] mt-4">
            <div class="font-semibold text-slate-700 text-[11px] uppercase tracking-wider mb-2 pb-2 border-b border-slate-200 flex justify-between items-center shrink-0">
                <span>Mini Harita</span>
                <i data-lucide="map" class="w-3.5 h-3.5 text-slate-400"></i>
            </div>
            <div id="minimap-container" class="relative w-full flex-1 bg-slate-50 overflow-hidden border border-slate-200 rounded cursor-crosshair">
                <canvas id="minimap-canvas" class="absolute top-0 left-0 w-full h-full"></canvas>
                <div id="minimap-viewport" class="absolute border-2 border-blue-500 bg-blue-500/20 pointer-events-none transition-none shadow-[0_0_0_9999px_rgba(0,0,0,0.25)]" style="display: none;"></div>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        
        // Setup global error handling so you don't have to check the console
        window.onerror = function(message, source, lineno, colno, error) {
            const errDiv = document.getElementById('error-overlay');
            const errTxt = document.getElementById('error-text');
            if(errDiv && errTxt) {
                errDiv.classList.remove('hidden');
                errTxt.textContent = `System Error: ${message}`;
            }
            return false; 
        };

        // Check if Lucide loaded correctly from the CDN
        if (typeof lucide === 'undefined') {
            throw new Error("Lucide Icons CDN failed to load. Please check your network or adblocker.");
        }

        // DOM Elements
        const errorOverlay = document.getElementById('error-overlay');
        const errorText = document.getElementById('error-text');
        const treeRoot = document.getElementById('tree-root');
        const treeTransform = document.getElementById('tree-transform');
        const scrollContainer = document.getElementById('scroll-container');
        
        const btnZoomIn = document.getElementById('btn-zoom-in');
        const btnZoomOut = document.getElementById('btn-zoom-out');
        const btnZoomReset = document.getElementById('btn-zoom-reset');
        const btnFocus = document.getElementById('btn-focus');

        const searchInput = document.getElementById('search-input');
        const btnSearchClear = document.getElementById('btn-search-clear');
        const btnSearchPrev = document.getElementById('btn-search-prev');
        const btnSearchNext = document.getElementById('btn-search-next');

        const personDetailsPanel = document.getElementById('person-details-panel');
        const personDetailsContent = document.getElementById('person-details-content');
        const btnCloseDetails = document.getElementById('btn-close-details');

        const generationLegend = document.getElementById('generation-legend');
        const legendList = document.getElementById('legend-list');

        const minimapWrapper = document.getElementById('minimap-wrapper');
        const minimapContainer = document.getElementById('minimap-container');
        const minimapCanvas = document.getElementById('minimap-canvas');
        const minimapViewport = document.getElementById('minimap-viewport');

        // State
        let currentZoom = 1;
        let isFocusMode = false;
        let searchResults = [];
        let currentSearchIndex = -1;

        // Initialize Lucide Icons on load
        lucide.createIcons();

        // Utility: Escape HTML to prevent XSS and rendering issues
        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // 15 birbirinden tamamen farklı ve zıt renk. (Global Scope)
        // Modulo (%) operatörü ile 15'ten derin ağaçlarda başa sararak sınırsız derinlik destekler.
        const generationColors = [
            { hex: '#ef4444', rgba: 'rgba(239, 68, 68, 0.3)' },   // 1: Kırmızı
            { hex: '#3b82f6', rgba: 'rgba(59, 130, 246, 0.3)' },  // 2: Mavi
            { hex: '#22c55e', rgba: 'rgba(34, 197, 94, 0.3)' },   // 3: Yeşil
            { hex: '#f97316', rgba: 'rgba(249, 115, 22, 0.3)' },  // 4: Turuncu
            { hex: '#a855f7', rgba: 'rgba(168, 85, 247, 0.3)' },  // 5: Mor
            { hex: '#06b6d4', rgba: 'rgba(6, 182, 212, 0.3)' },   // 6: Camgöbeği
            { hex: '#eab308', rgba: 'rgba(234, 179, 8, 0.3)' },   // 7: Sarı
            { hex: '#ec4899', rgba: 'rgba(236, 72, 153, 0.3)' },  // 8: Pembe
            { hex: '#84cc16', rgba: 'rgba(132, 204, 22, 0.3)' },  // 9: Limon Yeşili
            { hex: '#6366f1', rgba: 'rgba(99, 102, 241, 0.3)' },  // 10: Çivit Mavisi
            { hex: '#14b8a6', rgba: 'rgba(20, 184, 166, 0.3)' },  // 11: Turkuaz
            { hex: '#f43f5e', rgba: 'rgba(244, 63, 94, 0.3)' },   // 12: Gül Rengi
            { hex: '#f59e0b', rgba: 'rgba(245, 158, 11, 0.3)' },  // 13: Kehribar
            { hex: '#10b981', rgba: 'rgba(16, 185, 129, 0.3)' },  // 14: Zümrüt
            { hex: '#64748b', rgba: 'rgba(100, 116, 139, 0.3)' }  // 15: Arduvaz (Gri-Mavi)
        ];

        // Utility: Parse ID lists safely
        function parseIds(value) {
            if (!value) return [];
            if (Array.isArray(value)) return value;
            try { return JSON.parse(value); } 
            catch(e) { return [value]; }
        }

        // Utility: Generate HTML for a person's card to prevent code duplication
        function generateCardHTML(person, isSpouse = false) {
            if (!person) return '';
            const cardClass = isSpouse ? 'spouse-card' : 'direct-relative-card';
            const personIdAttr = person.id ? `data-id="${person.id}"` : '';
            const parentIdsAttr = (person._parentIds && person._parentIds.length > 0) ? `data-parent-ids="${person._parentIds.join(',')}"` : '';
            const spouseIdsAttr = (person._spouseIds && person._spouseIds.length > 0) ? `data-spouse-ids="${person._spouseIds.join(',')}"` : '';
            const genAttr = person._generation ? `data-generation="${person._generation}"` : '';
            
            const personDetails = { name: person.name, id: person.id, photoUrl: person.photoUrl, attributes: person.attributes };
            const detailsAttr = `data-details="${escapeHTML(JSON.stringify(personDetails))}"`;

            const name = person.name || "UNKNOWN";
            const surname = (person.attributes && person.attributes.surname) ? person.attributes.surname : '';

            const gender = (person.attributes && person.attributes.gender) ? person.attributes.gender : '';
            let genderBar = '';
            if (gender === 'Male') {
                genderBar = '<div class="absolute top-0 left-0 w-full h-1 bg-sky-400/50"></div>';
            } else if (gender === 'Female') {
                genderBar = '<div class="absolute top-0 left-0 w-full h-1 bg-rose-400/50"></div>';
            }

            let portraitHtml = '';
            if (person.photoUrl) {
                portraitHtml = `<img src="${escapeHTML(person.photoUrl)}" alt="${escapeHTML(name)}" class="w-16 h-16 rounded-full object-cover mx-auto mb-2 border-2 border-slate-100 shadow-sm shrink-0">`;
            } else {
                portraitHtml = `<div class="w-16 h-16 rounded-full bg-slate-50 mx-auto mb-2 flex items-center justify-center border-2 border-slate-100 shadow-sm shrink-0"><i data-lucide="user" class="w-8 h-8 text-slate-300"></i></div>`;
            }

            let html = `<div ${personIdAttr} ${parentIdsAttr} ${spouseIdsAttr} ${genAttr} ${detailsAttr} class="tree-node-card ${cardClass} bg-white border-2 border-slate-300 rounded-xl p-4 shadow-sm w-[200px] min-h-[10em] text-center relative z-10 cursor-pointer min-w-0 h-fit overflow-hidden">
                ${genderBar}
                ${portraitHtml}
                <h3 class="font-bold text-slate-900 text-lg hover:opacity-80 transition-opacity ${!surname ? 'mb-1' : ''}">${escapeHTML(name)}</h3>`;
            if (surname) {
                html += `<div class="font-semibold text-slate-700 text-base -mt-1 mb-1">${escapeHTML(surname)}</div>`;
            }
            
            const displayAttributes = Object.keys(person.attributes || {}).filter(k => k !== 'surname' && k !== 'gender');
            if (displayAttributes.length > 0) {
                html += `<div class="mt-2 flex flex-col gap-1 text-xs text-slate-600">`;
                for (const key of displayAttributes) {
                    const value = person.attributes[key];
                    if (key === 'note') {
                        html += `
                            <div class="bg-amber-50 px-2 py-1.5 rounded-md text-left whitespace-normal break-words mt-1 border border-amber-100">
                                <span class="font-semibold text-slate-800 capitalize">${escapeHTML(key)}:</span> ${escapeHTML(value)}
                            </div>`;
                    } else {
                        html += `
                            <div class="bg-white/70 px-2 py-1 rounded-md text-left whitespace-normal break-words" title="${escapeHTML(key)}: ${escapeHTML(value)}">
                                <span class="font-semibold text-slate-800 capitalize">${escapeHTML(key)}:</span> ${escapeHTML(value)}
                            </div>`;
                    }
                }
                html += `</div>`;
            }
            
            html += `</div>`;
            return html;
        }

        // Generate HTML for a single node recursively
        function generateNodeHTML(node) {
            if (!node || typeof node !== 'object') return '';

            const spousesWithChildren = node.spouses && Array.isArray(node.spouses) ? node.spouses.filter(s => s.children && Array.isArray(s.children) && s.children.length > 0) : [];
            const spousesWithoutChildren = node.spouses && Array.isArray(node.spouses) ? node.spouses.filter(s => !s.children || !Array.isArray(s.children) || s.children.length === 0) : [];
            const hasSpousesWithChildren = spousesWithChildren.length > 0;
            const hasDirectChildren = node.children && Array.isArray(node.children) && node.children.length > 0;

            let html = `<li class="relative">
                <div class="generation-wrapper flex items-start justify-center relative">
                    
                    <!-- Main Node Column -->
                    <div class="flex flex-col items-center relative z-10">
                        <div class="relative w-full flex justify-center items-center">
                            ${hasSpousesWithChildren ? `<div class="absolute top-1/2 right-0 w-1/2 h-[2px] bg-slate-400 -translate-y-1/2 z-0 marriage-line"></div>` : ''}
                            ${hasDirectChildren ? `<div class="absolute top-1/2 bottom-0 left-[calc(50%-1px)] border-l-2 border-slate-400 z-0"></div>` : ''}
                            <div class="flex items-center relative z-10">
                                ${generateCardHTML(node, false)}`;
            
            // Childless Spouses (rendered immediately next to the main node)
            if (spousesWithoutChildren.length > 0) {
                spousesWithoutChildren.forEach(spouse => {
                    html += `
                                <div class="w-8 h-[2px] bg-slate-400 z-0 shrink-0 relative marriage-line self-center"></div>
                                ${generateCardHTML(spouse, true)}`;
                });
            }
            
            html += `       </div>
                        </div>`; // Close Flex Container
            
            if (hasDirectChildren) {
                html += `<ul>`;
                node.children.forEach((child) => { html += generateNodeHTML(child); });
                html += `</ul>`;
            }
            
            html += `</div>`; // Close Main Node Column
            
            // Spouses Columns (only for spouses WITH children)
            if (hasSpousesWithChildren) {
                spousesWithChildren.forEach((spouse, index) => {
                    const isNotLast = index < spousesWithChildren.length - 1;
                    html += `
                    <!-- SPOUSE COLUMN -->
                    <div class="flex flex-col items-center relative z-10">
                        <div class="relative w-full flex justify-center items-center">
                            <!-- Connect to previous column -->
                            <div class="absolute top-1/2 left-0 w-1/2 h-[2px] bg-slate-400 -translate-y-1/2 z-0 marriage-line"></div>
                            <!-- Connect to next column -->
                            ${isNotLast ? `<div class="absolute top-1/2 right-0 w-1/2 h-[2px] bg-slate-400 -translate-y-1/2 z-0 marriage-line"></div>` : ''}
                            
                            ${(spouse.children && Array.isArray(spouse.children) && spouse.children.length > 0) ? `<div class="absolute top-1/2 bottom-0 left-[calc(50%-1px)] border-l-2 border-slate-400 z-0"></div>` : ''}
                            ${generateCardHTML(spouse, true)}
                        </div>`; // Close Spouse Card wrapper
                        
                    if (spouse.children && Array.isArray(spouse.children) && spouse.children.length > 0) {
                        html += `<ul>`;
                        spouse.children.forEach(child => { html += generateNodeHTML(child); });
                        html += `</ul>`;
                    }
                    
                    html += `</div>`; // Close Spouse Column
                });
            }
            
            html += `
                </div>
            </li>`;
            return html;
        }

        // Transform flat SQL-like data into the hierarchical format
        function buildHierarchy(flatData) {
            const nodeMap = new Map();
            
            // First pass: create node objects and map them
            flatData.forEach(row => {
                const node = {
                    id: row.id,
                    name: row.name,
                    photoUrl: row.photoUrl,
                    attributes: {},
                    _parentIds: [],
                    _spouseIds: [],
                    _visited: false,
                    _addedAsChild: false
                };
                
                node._parentIds = parseIds(row.parentIds);
                node._spouseIds = parseIds(row.spouseIds);
                
                if (row.surname) node.attributes.surname = row.surname;
                if (row.birthplace) node.attributes.birthplace = row.birthplace;
                if (row.birthdate) node.attributes.birthdate = row.birthdate;
                if (row.gender === 1) node.attributes.gender = 'Male';
                if (row.gender === 2) node.attributes.gender = 'Female';
                if (row.note) node.attributes.note = row.note;
                
                nodeMap.set(Number(row.id), node);
            });

            const roots = [];
            nodeMap.forEach(node => {
                // Nodes with no parents, or whose parents don't exist in the dataset, are roots
                const hasExistingParent = node._parentIds.some(pid => nodeMap.has(Number(pid)));
                if (!hasExistingParent) {
                    // Prevent nodes that are just spouses of someone with parents from becoming independent roots
                    const hasSpouseWithParent = node._spouseIds.some(spouseId => {
                        const spouse = nodeMap.get(Number(spouseId));
                        return spouse && spouse._parentIds.some(pid => nodeMap.has(Number(pid)));
                    });
                    
                    if (!hasSpouseWithParent) {
                        roots.push(node);
                    }
                }
            });

            function buildNode(nodeId, asSpouse = false, depth = 1) {
                const node = nodeMap.get(Number(nodeId));
                if (!node) return null;
                
                // If already visited, return null to prevent duplication and cycles
                if (node._visited) return null; 
                node._visited = true;

                const result = { 
                    id: node.id,
                    _parentIds: node._parentIds,
                    _spouseIds: node._spouseIds,
                    _generation: depth,
                    name: node.name, 
                    photoUrl: node.photoUrl,
                    attributes: { ...node.attributes }, 
                    children: [], 
                    spouses: [] 
                };

                // 1. Claim direct children first so they fall under the correct parent
                nodeMap.forEach(potentialChild => {
                    if (potentialChild._parentIds.map(Number).includes(Number(node.id)) && !potentialChild._addedAsChild) {
                        potentialChild._addedAsChild = true;
                        const childNode = buildNode(potentialChild.id, false, depth + 1);
                        if (childNode) result.children.push(childNode);
                    }
                });

                // 2. Attach spouses
                if (!asSpouse) {
                    node._spouseIds.forEach(spouseId => {
                        const spouseNode = buildNode(spouseId, true, depth);
                        if (spouseNode) result.spouses.push(spouseNode);
                    });
                }
                return result;
            }

            return roots.map(root => buildNode(root.id, false, 1)).filter(Boolean);
        }

        // Calculate vertical line heights and sync row heights for perfect marriage line connections
        function syncRowHeights() {
            document.querySelectorAll('.generation-wrapper').forEach(wrapper => {
                    const columns = Array.from(wrapper.children);
                    const cardWrappers = columns
                        .map(col => col.querySelector('.relative.w-full.flex'))
                        .filter(Boolean);
                    
                    let maxHeight = 0;
                    cardWrappers.forEach(cw => {
                        // Find the inner content container (the one without 'absolute' position)
                        const innerContent = Array.from(cw.children).find(child => !child.classList.contains('absolute'));
                        if (innerContent && innerContent.offsetHeight > maxHeight) {
                            maxHeight = innerContent.offsetHeight;
                        }
                    });
                    
                    cardWrappers.forEach(cw => {
                        cw.style.height = maxHeight + 'px';
                    });

                    // Dynamically set the upward line height so it connects exactly to the marriage line center
                    wrapper.style.setProperty('--line-height', (20 + (maxHeight / 2)) + 'px');
            });
        }

        // Fetch Data and Render Tree Logic
        async function loadAndRenderTree() {
            try {
                // Initialize sql.js WebAssembly
                const SQL = await initSqlJs({
                    locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
                });

                const dbFileName = 'data.sqlite';
                // Add a cache-busting timestamp to prevent the browser from serving a stale cached file
                const response = await fetch(`${dbFileName}?t=${Date.now()}`);
                if (!response.ok) {
                    throw new Error(`Failed to load ${dbFileName} (${response.status}: ${response.statusText}). Note: Browsers block fetch requests on the file:// protocol. Please serve this folder using a local web server.`);
                }
                
                // Read the database file into memory
                const buffer = await response.arrayBuffer();
                const db = new SQL.Database(new Uint8Array(buffer));

                // Query the database
                const peopleStmt = db.prepare("SELECT * FROM People");
                const people = [];
                while (peopleStmt.step()) {
                    people.push(peopleStmt.getAsObject());
                }
                peopleStmt.free();

                const spousesStmt = db.prepare("SELECT * FROM Spouses");
                const spouses = [];
                while (spousesStmt.step()) {
                    spouses.push(spousesStmt.getAsObject());
                }
                spousesStmt.free();

                const parentsStmt = db.prepare("SELECT * FROM Parents");
                const parents = [];
                while (parentsStmt.step()) {
                    parents.push(parentsStmt.getAsObject());
                }
                parentsStmt.free();

                db.close();
                
                const parsed = people.map(person => {
                    const spouseIds = spouses
                        .filter(s => s.spouse1Id === person.id || s.spouse2Id === person.id)
                        .map(s => s.spouse1Id === person.id ? s.spouse2Id : s.spouse1Id);

                    const parentIds = parents
                        .filter(p => p.childId === person.id)
                        .flatMap(p => [p.parent1Id, p.parent2Id])
                        .filter(id => id != null);

                    return { ...person, spouseIds, parentIds };
                });

                let roots = [];
                // Detect if data is a flat SQL export instead of a tree
                const isFlatSqlData = Array.isArray(parsed) && parsed.length > 0 && 'id' in parsed[0];
                if (isFlatSqlData) {
                    roots = buildHierarchy(parsed);
                } else {
                    roots = Array.isArray(parsed) ? parsed : [parsed];
                }
                
                let rootsHTML = '<div class="roots-container">';
                roots.forEach(root => {
                    rootsHTML += `<ul class="family-root m-0 p-0 flex justify-center">${generateNodeHTML(root)}</ul>`;
                });
                rootsHTML += '</div>';

                // Build Tree
                treeRoot.innerHTML = rootsHTML;
                errorOverlay.classList.add('hidden');

                // Show generation legend
                generationLegend.classList.remove('hidden');
                generationLegend.classList.add('flex');

                if (minimapWrapper) {
                    minimapWrapper.classList.remove('hidden');
                    minimapWrapper.classList.add('flex');
                }

                // Dynamically populate Color Legend based on actual generations in the tree
                let maxGen = 1;
                document.querySelectorAll('.tree-node-card[data-generation]').forEach(card => {
                    const gen = parseInt(card.getAttribute('data-generation')) || 1;
                    if (gen > maxGen) maxGen = gen;
                });
                
                legendList.innerHTML = '';
                for (let i = 1; i <= maxGen; i++) {
                    const color = generationColors[(i - 1) % generationColors.length];
                    legendList.innerHTML += `
                        <div class="flex items-center gap-2 p-1.5 -mx-1.5 rounded-md cursor-pointer hover:bg-slate-100 transition-colors legend-item" data-gen="${i}" title="Bu jenerasyondaki herkesi vurgula">
                            <div class="w-3 h-3 rounded-full flex-shrink-0 border border-slate-200 shadow-sm" style="background-color: ${color.hex}"></div>
                            <span class="truncate">${i}. Nesil</span>
                        </div>`;
                }
                
                const legendNote = document.getElementById('legend-note');
                if (legendNote) {
                    if (maxGen > 15) legendNote.classList.remove('hidden');
                    else legendNote.classList.add('hidden');
                }

                // Calculate vertical line heights and sync row heights for perfect marriage line connections
                function syncRowHeights() {
                    document.querySelectorAll('.generation-wrapper').forEach(wrapper => {
                            const columns = Array.from(wrapper.children);
                            const cardWrappers = columns
                                .map(col => col.querySelector('.relative.w-full.flex'))
                                .filter(Boolean);
                            
                            let maxHeight = 0;
                            cardWrappers.forEach(cw => {
                                // Find the inner content container (the one without 'absolute' position)
                                const innerContent = Array.from(cw.children).find(child => !child.classList.contains('absolute'));
                                if (innerContent && innerContent.offsetHeight > maxHeight) {
                                    maxHeight = innerContent.offsetHeight;
                                }
                            });
                            
                            cardWrappers.forEach(cw => {
                                cw.style.height = maxHeight + 'px';
                            });

                            // Dynamically set the upward line height so it connects exactly to the marriage line center
                            wrapper.style.setProperty('--line-height', (20 + (maxHeight / 2)) + 'px');
                    });
                }
                
                syncRowHeights();
                
                // Ensure heights stay perfectly synced when text wraps, window resizes, or fonts load
                const resizeObserver = new ResizeObserver(() => {
                    syncRowHeights();
                    drawMinimap();
                });
                
                // Observe all tree node cards for intrinsic size changes
                document.querySelectorAll('.tree-node-card').forEach(card => {
                    resizeObserver.observe(card);
                });

                // Crucial: Re-initialize Lucide icons for dynamically injected elements
                lucide.createIcons();

                // Call update on initial render to calculate base physical bounds
                updateZoomStyle();

                // Delay scrolling until the browser has finished painting the initial layout.
                // This ensures getBoundingClientRect() returns the final, correct positions.
                setTimeout(() => {
                    const targetCard = document.querySelector('.family-root .tree-node-card');

                    if (targetCard) {
                        const cardRect = targetCard.getBoundingClientRect();
                        const treeRect = treeTransform.getBoundingClientRect();
                        const containerRect = scrollContainer.getBoundingClientRect();
                        
                        // Center the card in the viewport
                        const cardCenterX = (cardRect.left - treeRect.left) + (cardRect.width / 2);
                        const cardCenterY = (cardRect.top - treeRect.top) + (cardRect.height / 2);
                        
                        scrollContainer.scrollLeft = cardCenterX - (containerRect.width / 2);
                        scrollContainer.scrollTop = cardCenterY - (containerRect.height / 2);
                    } else {
                        // Fallback to centering the whole tree if no card is found
                        scrollContainer.scrollLeft = (scrollContainer.scrollWidth - scrollContainer.clientWidth) / 2;
                        scrollContainer.scrollTop = 0;
                    }
                }, 100);

                // Slight delay to ensure layout is physically finished before rendering minimap
                setTimeout(drawMinimap, 100);

            } catch (err) {
                errorText.textContent = err.message;
                errorOverlay.classList.remove('hidden');
                
                // Show error state in the tree area
                treeRoot.innerHTML = `
                    <div class="text-slate-400 flex flex-col items-center mt-20">
                        <i data-lucide="alert-circle" class="w-12 h-12 mb-4 opacity-20"></i>
                        <p>No valid tree data to display.</p>
                    </div>
                `;
                lucide.createIcons();
            }
        }

        // Zoom Functions
        function updateZoomStyle(newScrollLeft = null, newScrollTop = null) {
            treeTransform.style.transform = `scale(${currentZoom})`;
            
            // Calculate and explicitly set the wrapper's physical dimensions.
            // This forces the scrollbars to recognize the new scaled size, completely preventing clipping!
            const unscaledWidth = treeTransform.offsetWidth;
            const unscaledHeight = treeTransform.offsetHeight;
            
            const wrapper = document.getElementById('scale-wrapper');
            if (wrapper) {
                wrapper.style.width = `${unscaledWidth * currentZoom}px`;
                wrapper.style.height = `${unscaledHeight * currentZoom}px`;
            }

            if (newScrollLeft !== null && newScrollTop !== null) {
                scrollContainer.scrollLeft = newScrollLeft;
                scrollContainer.scrollTop = newScrollTop;
            }
            
            updateMinimapViewport();
        }

        function applyZoomFromCenter(newZoom) {
            const oldZoom = currentZoom;
            if (newZoom === oldZoom) return;
            
            currentZoom = newZoom;
            
            // Calculate center of the viewport
            const centerX = scrollContainer.clientWidth / 2;
            const centerY = scrollContainer.clientHeight / 2;
            
            // Calculate new scroll position to keep the center stationary
            const zoomRatio = currentZoom / oldZoom;
            const newScrollLeft = (scrollContainer.scrollLeft + centerX) * zoomRatio - centerX;
            const newScrollTop = (scrollContainer.scrollTop + centerY) * zoomRatio - centerY;
            
            updateZoomStyle(newScrollLeft, newScrollTop);
        }

        btnZoomIn.addEventListener('click', () => {
            applyZoomFromCenter(Math.min(currentZoom + 0.2, 2));
        });

        btnZoomOut.addEventListener('click', () => {
            applyZoomFromCenter(Math.max(currentZoom - 0.2, 0.05));
        });

        btnZoomReset.addEventListener('click', () => {
            if (isFocusMode) {
                fitTreeToScreen();
            } else {
                applyZoomFromCenter(1);
            }
        });

        function fitTreeToScreen() {
            const treeW = treeTransform.offsetWidth;
            const treeH = treeTransform.offsetHeight;
            
            if (treeW === 0 || treeH === 0) return;

            const viewW = scrollContainer.clientWidth;
            const viewH = scrollContainer.clientHeight;
            
            const padding = 80; // 40px each side
            let newZoom = Math.min((viewW - padding) / treeW, (viewH - padding) / treeH);
            currentZoom = Math.max(0.05, Math.min(newZoom, 1.2)); // Cap scale to not over-blow small trees
            
            updateZoomStyle();
            scrollContainer.scrollLeft = (scrollContainer.scrollWidth - scrollContainer.clientWidth) / 2;
            scrollContainer.scrollTop = (scrollContainer.scrollHeight - scrollContainer.clientHeight) / 2;
        }

        function toggleFocusMode(forceState) {
            if (typeof forceState === 'boolean') {
                if (isFocusMode === forceState) return;
                isFocusMode = forceState;
            } else {
                isFocusMode = !isFocusMode;
            }

            if (btnFocus) {
                if (isFocusMode) {
                    btnFocus.classList.add('bg-blue-50', 'text-blue-600');
                    btnFocus.classList.remove('text-slate-600');
                } else {
                    btnFocus.classList.remove('bg-blue-50', 'text-blue-600');
                    btnFocus.classList.add('text-slate-600');
                }
            }

            // Reset all hidden elements
            document.querySelectorAll('.focus-hidden').forEach(el => el.classList.remove('focus-hidden'));
            document.querySelectorAll('.hide-parent-lines').forEach(el => el.classList.remove('hide-parent-lines'));

            if (isFocusMode) {
                const highlightedCards = document.querySelectorAll('.tree-node-card.highlighted, .tree-node-card.highlighted-gen, .tree-node-card.highlighted-spouse');
                if (highlightedCards.length === 0) {
                    isFocusMode = false;
                    if (btnFocus) {
                        btnFocus.classList.remove('bg-blue-50', 'text-blue-600');
                        btnFocus.classList.add('text-red-500');
                        setTimeout(() => {
                            btnFocus.classList.remove('text-red-500');
                            btnFocus.classList.add('text-slate-600');
                        }, 500);
                    }
                    return;
                }

                // 1. Hide non-highlighted cards and their specific marriage lines
                document.querySelectorAll('.tree-node-card').forEach(card => {
                    if (!card.classList.contains('highlighted') && !card.classList.contains('highlighted-gen') && !card.classList.contains('highlighted-spouse')) {
                        card.classList.add('focus-hidden');
                        // Childless spouse inline marriage line
                        if (card.classList.contains('spouse-card')) {
                            const prev = card.previousElementSibling;
                            if (prev && prev.classList.contains('marriage-line') && !prev.classList.contains('absolute')) {
                                prev.classList.add('focus-hidden');
                            }
                        }
                    }
                });

                // 2. Hide columns without visible cards
                document.querySelectorAll('.generation-wrapper > .flex-col').forEach(col => {
                    const visibleCards = col.querySelectorAll('.tree-node-card:not(.focus-hidden)');
                    if (visibleCards.length === 0) {
                        col.classList.add('focus-hidden');
                    }
                });

                // 3. Hide list items without visible cards
                document.querySelectorAll('li').forEach(li => {
                    const visibleCards = li.querySelectorAll('.tree-node-card:not(.focus-hidden)');
                    if (visibleCards.length === 0) {
                        li.classList.add('focus-hidden');
                    }
                });

                // 4. Clean up structural marriage lines
                document.querySelectorAll('.generation-wrapper').forEach(wrapper => {
                    const visibleCols = Array.from(wrapper.querySelectorAll(':scope > .flex-col:not(.focus-hidden)'));
                    if (visibleCols.length <= 1) {
                        wrapper.querySelectorAll('.marriage-line.absolute').forEach(line => line.classList.add('focus-hidden'));
                    } else {
                        const lastCol = visibleCols[visibleCols.length - 1];
                        const rightLine = lastCol.querySelector('.marriage-line.right-0');
                        if (rightLine) rightLine.classList.add('focus-hidden');

                        const firstCol = visibleCols[0];
                        const leftLine = firstCol.querySelector('.marriage-line.left-0');
                        if (leftLine) leftLine.classList.add('focus-hidden');
                    }
                });

                // 4.5 Clean up vertical lines for nodes whose parents are hidden
                document.querySelectorAll('ul').forEach(ul => {
                    const parentWrapper = ul.previousElementSibling;
                    if (parentWrapper && parentWrapper.classList.contains('relative') && parentWrapper.classList.contains('w-full')) {
                        const visibleCards = parentWrapper.querySelectorAll('.tree-node-card:not(.focus-hidden)');
                        if (visibleCards.length === 0) {
                            ul.classList.add('hide-parent-lines');
                            const downwardLine = parentWrapper.querySelector('.border-l-2');
                            if (downwardLine) downwardLine.classList.add('focus-hidden');
                        }
                    }
                });
            }

            // 5. Update pseudo-element hook classes for visual layout
            document.querySelectorAll('.visual-first-child, .visual-last-child, .visual-only-child').forEach(el => {
                el.classList.remove('visual-first-child', 'visual-last-child', 'visual-only-child');
            });

            if (isFocusMode) {
                document.querySelectorAll('ul').forEach(ul => {
                    const visibleLis = Array.from(ul.children).filter(child => 
                        child.tagName === 'LI' && !child.classList.contains('focus-hidden')
                    );
                    
                    if (visibleLis.length === 1) {
                        visibleLis[0].classList.add('visual-only-child');
                    } else if (visibleLis.length > 1) {
                        visibleLis[0].classList.add('visual-first-child');
                        visibleLis[visibleLis.length - 1].classList.add('visual-last-child');
                    }
                });
            }

            // Recalculate physical dimensions and heights
            syncRowHeights();
            setTimeout(() => {
                if (isFocusMode) {
                    updateZoomStyle(); // re-eval physical dimensions for the wrapper
                    fitTreeToScreen();
                } else {
                    currentZoom = 1;
                    updateZoomStyle();
                    
                    const targetCard = document.querySelector('.tree-node-card.highlighted');
                    if (targetCard) {
                        const cardRect = targetCard.getBoundingClientRect();
                        const treeRect = treeTransform.getBoundingClientRect();
                        const containerRect = scrollContainer.getBoundingClientRect();
                        
                        const cardCenterX = (cardRect.left - treeRect.left) + (cardRect.width / 2);
                        const cardCenterY = (cardRect.top - treeRect.top) + (cardRect.height / 2);
                        
                        scrollContainer.scrollLeft = cardCenterX - (containerRect.width / 2);
                        scrollContainer.scrollTop = cardCenterY - (containerRect.height / 2);
                    }
                }
                drawMinimap();
            }, 50);
        }

        if (btnFocus) {
            btnFocus.addEventListener('click', () => toggleFocusMode());
        }

        // Zoom on mouse scroll wheel
        scrollContainer.addEventListener('wheel', (e) => {
            // Prevent default vertical/horizontal scrolling behavior
            e.preventDefault();

            // deltaY < 0 means scrolling up (zoom in)
            const isZoomingIn = e.deltaY < 0;
            
            // Default step for standard mouse wheel zooming
            let zoomDelta = 0.1;

            // Smooth pinch-to-zoom on trackpads triggers the wheel event with ctrlKey
            if (e.ctrlKey) {
                zoomDelta = Math.abs(e.deltaY) * 0.01;
            }

            const oldZoom = currentZoom;
            currentZoom = isZoomingIn ? Math.min(currentZoom + zoomDelta, 2) : Math.max(currentZoom - zoomDelta, 0.05);
            
            if (currentZoom !== oldZoom) {
                // Get mouse coordinates relative to the scroll container
                const rect = scrollContainer.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                
                // Calculate new scroll position to keep the content under the mouse stationary
                const zoomRatio = currentZoom / oldZoom;
                const newScrollLeft = (scrollContainer.scrollLeft + mouseX) * zoomRatio - mouseX;
                const newScrollTop = (scrollContainer.scrollTop + mouseY) * zoomRatio - mouseY;
                
                updateZoomStyle(newScrollLeft, newScrollTop);
            }
        }, { passive: false }); // Passive must be false to allow preventDefault()

        // Drag to scroll functionality
        let isDragging = false;
        let startX, startY, initialScrollLeft, initialScrollTop;

        scrollContainer.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return; // Only allow left click
            isDragging = true;
            scrollContainer.classList.add('cursor-grabbing');
            scrollContainer.classList.remove('cursor-grab');
            scrollContainer.style.userSelect = 'none'; // Prevent text selection while dragging
            
            startX = e.pageX - scrollContainer.offsetLeft;
            startY = e.pageY - scrollContainer.offsetTop;
            initialScrollLeft = scrollContainer.scrollLeft;
            initialScrollTop = scrollContainer.scrollTop;
        });

        const stopDragging = () => {
            isDragging = false;
            scrollContainer.classList.remove('cursor-grabbing');
            scrollContainer.classList.add('cursor-grab');
            scrollContainer.style.userSelect = '';
        };

        scrollContainer.addEventListener('mouseleave', stopDragging);
        scrollContainer.addEventListener('mouseup', stopDragging);

        scrollContainer.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            e.preventDefault(); // Prevent default browser drag behavior
            
            const x = e.pageX - scrollContainer.offsetLeft;
            const y = e.pageY - scrollContainer.offsetTop;
            const walkX = x - startX;
            const walkY = y - startY;
            
            // Adjust the scroll position
            scrollContainer.scrollLeft = initialScrollLeft - walkX;
            scrollContainer.scrollTop = initialScrollTop - walkY;
        });

        // Minimap Drawing and Interaction
        function drawMinimap() {
            if (!minimapContainer || !minimapCanvas) return;
            const ctx = minimapCanvas.getContext('2d');
            
            minimapCanvas.width = minimapContainer.clientWidth;
            minimapCanvas.height = minimapContainer.clientHeight;
            
            const treeRect = treeTransform.getBoundingClientRect();
            const treeWidth = treeRect.width / currentZoom;
            const treeHeight = treeRect.height / currentZoom;
            
            if (treeWidth === 0 || treeHeight === 0) return;

            const padding = 10; 
            const scaleX = (minimapCanvas.width - padding * 2) / treeWidth;
            const scaleY = (minimapCanvas.height - padding * 2) / treeHeight;
            const minimapScale = Math.min(scaleX, scaleY);
            
            const offsetX = (minimapCanvas.width - treeWidth * minimapScale) / 2;
            const offsetY = (minimapCanvas.height - treeHeight * minimapScale) / 2;
            
            ctx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);
            minimapContainer._metrics = { minimapScale, offsetX, offsetY, treeWidth, treeHeight };
            
            document.querySelectorAll('.tree-node-card').forEach(card => {
                const rect = card.getBoundingClientRect();
                const x = (rect.left - treeRect.left) / currentZoom;
                const y = (rect.top - treeRect.top) / currentZoom;
                const w = rect.width / currentZoom;
                const h = rect.height / currentZoom;
                
                if (card.classList.contains('highlighted') || card.classList.contains('highlighted-gen') || card.classList.contains('highlighted-spouse')) {
                    ctx.fillStyle = card.style.getPropertyValue('--highlight-color').trim() || '#3b82f6';
                } else {
                    ctx.fillStyle = '#475569'; // Darker slate for better contrast
                }
                ctx.fillRect(offsetX + x * minimapScale, offsetY + y * minimapScale, w * minimapScale, h * minimapScale);
            });
            
            updateMinimapViewport();
        }

        function updateMinimapViewport() {
            if (!minimapContainer || !minimapViewport || !minimapContainer._metrics) return;
            const metrics = minimapContainer._metrics;
            minimapViewport.style.display = 'block';
            
            const scrollRect = scrollContainer.getBoundingClientRect();
            const treeRect = treeTransform.getBoundingClientRect();
            
            const visibleLeftOnTree = scrollRect.left - treeRect.left;
            const visibleTopOnTree = scrollRect.top - treeRect.top;
            
            const unscaledScrollX = visibleLeftOnTree / currentZoom;
            const unscaledScrollY = visibleTopOnTree / currentZoom;
            const unscaledVisibleW = scrollRect.width / currentZoom;
            const unscaledVisibleH = scrollRect.height / currentZoom;
            
            let mapX = metrics.offsetX + unscaledScrollX * metrics.minimapScale;
            let mapY = metrics.offsetY + unscaledScrollY * metrics.minimapScale;
            let mapW = unscaledVisibleW * metrics.minimapScale;
            let mapH = unscaledVisibleH * metrics.minimapScale;
            
            minimapViewport.style.left = `${mapX}px`;
            minimapViewport.style.top = `${mapY}px`;
            minimapViewport.style.width = `${mapW}px`;
            minimapViewport.style.height = `${mapH}px`;
        }

        scrollContainer.addEventListener('scroll', updateMinimapViewport);
        window.addEventListener('resize', drawMinimap);

        // Node selection and bloodline highlighting logic
        treeRoot.addEventListener('click', (e) => {
            if (isFocusMode) return;
            
            const card = e.target.closest('.tree-node-card');
            if (!card) return;
            
            const isAlreadyHighlighted = card.classList.contains('highlighted');
            
            // Clear previous highlights
            document.querySelectorAll('.tree-node-card.highlighted, .tree-node-card.highlighted-gen, .tree-node-card.highlighted-spouse').forEach(el => {
                el.classList.remove('highlighted', 'highlighted-gen', 'highlighted-spouse');
                el.style.removeProperty('--highlight-color');
                el.style.removeProperty('--highlight-shadow');
            });
            
            // Menüdeki (legend) aktif seçimi de temizle
            document.querySelectorAll('.legend-item').forEach(el => {
                el.classList.remove('active-legend', 'bg-slate-100', 'font-semibold', 'text-slate-900');
            });
            
            personDetailsPanel.classList.add('hidden');
            personDetailsPanel.classList.remove('flex');
            
            // Highlight logic (toggles off if clicking the currently highlighted card)
            if (!isAlreadyHighlighted) {
                card.classList.add('highlighted');
                
                const detailsStr = card.getAttribute('data-details');
                if (detailsStr) {
                    try {
                        const details = JSON.parse(detailsStr);
                        const name = details.name || "UNKNOWN";
                        const surname = (details.attributes && details.attributes.surname) ? details.attributes.surname : '';
                        
                        let detailsHTML = '';
                        if (details.photoUrl) {
                            detailsHTML += `<img src="${escapeHTML(details.photoUrl)}" alt="Portrait" class="w-16 h-16 rounded-full object-cover mx-auto mb-2 border-2 border-slate-100 shadow-sm shrink-0">`;
                        } else {
                            detailsHTML += `<div class="w-16 h-16 rounded-full bg-slate-50 mx-auto mb-2 flex items-center justify-center border-2 border-slate-100 shadow-sm shrink-0"><i data-lucide="user" class="w-8 h-8 text-slate-300"></i></div>`;
                        }
                        
                        detailsHTML += `<div class="font-bold text-slate-900 text-sm ${!surname ? 'mb-1' : ''}">${escapeHTML(name)}</div>`;
                        if (surname) {
                            detailsHTML += `<div class="font-semibold text-slate-700 text-sm mb-1">${escapeHTML(surname)}</div>`;
                        }
                        detailsHTML += `<div class="text-[10px] text-slate-400 font-mono mb-2 border-b border-slate-100 pb-2">ID: ${escapeHTML(details.id)}</div>`;
                        
                        const displayAttributes = Object.keys(details.attributes || {}).filter(k => k !== 'surname' && k !== 'gender');
                        if (displayAttributes.length > 0) {
                            for (const key of displayAttributes) {
                                const value = details.attributes[key];
                                if (key === 'note') {
                                    detailsHTML += `
                                        <div class="bg-amber-50 px-2 py-1.5 rounded-md border border-amber-100">
                                            <div class="font-semibold text-slate-800 text-[10px] uppercase mb-0.5">${escapeHTML(key)}</div>
                                            <div class="whitespace-normal break-words text-slate-800">${escapeHTML(value)}</div>
                                        </div>`;
                                } else {
                                    detailsHTML += `
                                        <div class="bg-slate-50 px-2 py-1.5 rounded-md border border-slate-100">
                                            <div class="font-semibold text-slate-700 text-[10px] uppercase mb-0.5">${escapeHTML(key)}</div>
                                            <div class="whitespace-normal break-words text-slate-800">${escapeHTML(value)}</div>
                                        </div>`;
                                }
                            }
                        }
                        personDetailsContent.innerHTML = detailsHTML;
                        personDetailsPanel.classList.remove('hidden');
                        personDetailsPanel.classList.add('flex');
                        lucide.createIcons();
                    } catch (err) {
                        console.error("Failed to parse person details", err);
                    }
                }
                
                // Pre-compute child map for O(1) descendant lookups
                const childMap = {};
                document.querySelectorAll('.tree-node-card[data-parent-ids]').forEach(el => {
                    const pids = el.getAttribute('data-parent-ids').split(',');
                    pids.forEach(pid => {
                        if (!childMap[pid]) childMap[pid] = [];
                        childMap[pid].push(el);
                    });
                });

                function applyHighlightGen(element) {
                    const gen = parseInt(element.getAttribute('data-generation')) || 1;
                    const colorObj = generationColors[(gen - 1) % generationColors.length];
                    
                    element.classList.add('highlighted-gen');
                    element.style.setProperty('--highlight-color', colorObj.hex);
                    element.style.setProperty('--highlight-shadow', `0 0 0 4px ${colorObj.rgba}`);
                }

                // Recursive function to highlight ancestors
                function highlightAncestors(currentCard) {
                    const parentIdsAttr = currentCard.getAttribute('data-parent-ids');
                    if (parentIdsAttr) {
                        parentIdsAttr.split(',').forEach(pid => {
                            document.querySelectorAll(`.tree-node-card[data-id="${pid}"]`).forEach(parentCard => {
                                if (!parentCard.classList.contains('highlighted-gen')) {
                                    applyHighlightGen(parentCard);
                                    highlightAncestors(parentCard);
                                }
                            });
                        });
                    }
                }
                
                // Recursive function to highlight descendants
                function highlightDescendants(currentCard) {
                    const currentId = currentCard.getAttribute('data-id');
                    if (!currentId || !childMap[currentId]) return;
                    
                    childMap[currentId].forEach(childCard => {
                        if (!childCard.classList.contains('highlighted-gen')) {
                            applyHighlightGen(childCard);
                            highlightDescendants(childCard);
                        }
                    });
                }
                
                function highlightSpouses(currentCard) {
                    const spouseIdsAttr = currentCard.getAttribute('data-spouse-ids');
                    if (spouseIdsAttr) {
                        spouseIdsAttr.split(',').forEach(sid => {
                            document.querySelectorAll(`.tree-node-card[data-id="${sid}"]`).forEach(spouseCard => {
                                if (!spouseCard.classList.contains('highlighted-gen') && !spouseCard.classList.contains('highlighted') && !spouseCard.classList.contains('highlighted-spouse')) {
                                    spouseCard.classList.add('highlighted-spouse');
                                }
                            });
                        });
                    }
                }
                
                applyHighlightGen(card);
                highlightAncestors(card);
                highlightDescendants(card);
                highlightSpouses(card);
            }
            
            drawMinimap();
        });

        // Close Person Details Panel
        btnCloseDetails.addEventListener('click', () => {
            if (isFocusMode) toggleFocusMode(false);
            
            document.querySelectorAll('.tree-node-card.highlighted, .tree-node-card.highlighted-gen, .tree-node-card.highlighted-spouse').forEach(el => {
                el.classList.remove('highlighted', 'highlighted-gen', 'highlighted-spouse');
                el.style.removeProperty('--highlight-color');
                el.style.removeProperty('--highlight-shadow');
            });
            
            document.querySelectorAll('.legend-item').forEach(el => {
                el.classList.remove('active-legend', 'bg-slate-100', 'font-semibold', 'text-slate-900');
            });
            
            personDetailsPanel.classList.add('hidden');
            personDetailsPanel.classList.remove('flex');
            
            drawMinimap();
        });

        // Renk (Legend) listesinden jenerasyon seçilince tüm grubu vurgulama
        legendList.addEventListener('click', (e) => {
            if (isFocusMode) return;
            
            const item = e.target.closest('.legend-item');
            if (!item) return;
            
            const targetGen = item.getAttribute('data-gen');
            const isActive = item.classList.contains('active-legend');
            
            // Hem ağaçtaki hem de menüdeki mevcut vurguları temizle
            document.querySelectorAll('.tree-node-card.highlighted, .tree-node-card.highlighted-gen, .tree-node-card.highlighted-spouse').forEach(el => {
                el.classList.remove('highlighted', 'highlighted-gen', 'highlighted-spouse');
                el.style.removeProperty('--highlight-color');
                el.style.removeProperty('--highlight-shadow');
            });
            document.querySelectorAll('.legend-item').forEach(el => {
                el.classList.remove('active-legend', 'bg-slate-100', 'font-semibold', 'text-slate-900');
            });
            
            personDetailsPanel.classList.add('hidden');
            personDetailsPanel.classList.remove('flex');
            
            // Eğer daha önceden aktif değilse, listeyi aktif yap ve ilgili jenerasyonu vurgula
            if (!isActive) {
                item.classList.add('active-legend', 'bg-slate-100', 'font-semibold', 'text-slate-900');
                
                document.querySelectorAll(`.tree-node-card[data-generation="${targetGen}"]`).forEach(card => {
                    const colorObj = generationColors[(parseInt(targetGen) - 1) % generationColors.length];
                    card.classList.add('highlighted-gen');
                    card.style.setProperty('--highlight-color', colorObj.hex);
                    card.style.setProperty('--highlight-shadow', `0 0 0 4px ${colorObj.rgba}`);
                });
            }
            
            drawMinimap();
        });

        // Drag logic for Minimap
        let isMinimapDragging = false;
        function scrollToMinimapPos(e) {
            const metrics = minimapContainer._metrics;
            if (!metrics) return;
            
            const rect = minimapContainer.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;
            
            const targetUnscaledX = (clickX - metrics.offsetX) / metrics.minimapScale;
            const targetUnscaledY = (clickY - metrics.offsetY) / metrics.minimapScale;
            
            const scrollRect = scrollContainer.getBoundingClientRect();
            const unscaledVisibleW = scrollRect.width / currentZoom;
            const unscaledVisibleH = scrollRect.height / currentZoom;
            
            const treeRect = treeTransform.getBoundingClientRect();
            const currentVisibleLeftOnTree = (scrollRect.left - treeRect.left) / currentZoom;
            const currentVisibleTopOnTree = (scrollRect.top - treeRect.top) / currentZoom;
            
            const currentCenterX = currentVisibleLeftOnTree + (unscaledVisibleW / 2);
            const currentCenterY = currentVisibleTopOnTree + (unscaledVisibleH / 2);
            
            scrollContainer.scrollLeft += (targetUnscaledX - currentCenterX) * currentZoom;
            scrollContainer.scrollTop += (targetUnscaledY - currentCenterY) * currentZoom;
        }

        minimapContainer.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            isMinimapDragging = true;
            scrollToMinimapPos(e);
            e.preventDefault(); // prevent selection while dragging map
        });
        window.addEventListener('mouseup', () => { isMinimapDragging = false; });
        window.addEventListener('mousemove', (e) => {
            if (isMinimapDragging) {
                scrollToMinimapPos(e);
                e.preventDefault();
            }
        });

        // --- Search Logic ---
        function performSearch() {
            const query = searchInput.value.trim().toLocaleLowerCase('tr-TR');
            
            // Temizle butonunu göster/gizle
            if (query.length > 0) {
                btnSearchClear.classList.remove('hidden');
                btnSearchClear.classList.add('flex');
            } else {
                btnSearchClear.classList.add('hidden');
                btnSearchClear.classList.remove('flex');
            }

            document.querySelectorAll('.search-match').forEach(el => el.classList.remove('search-match'));
            searchResults = [];
            currentSearchIndex = -1;

            if (!query) return;

            // Exit focus mode to ensure all potential matches are visible
            if (isFocusMode) toggleFocusMode(false);

            document.querySelectorAll('.tree-node-card').forEach(card => {
                const detailsStr = card.getAttribute('data-details');
                if (detailsStr) {
                    try {
                        const details = JSON.parse(detailsStr);
                        const searchableValues = [
                            details.name,
                            details.id,
                            ...(details.attributes ? Object.values(details.attributes) : [])
                        ];
                        
                        const text = searchableValues.filter(Boolean).join(' ').toLocaleLowerCase('tr-TR');

                        if (text.includes(query)) {
                            searchResults.push(card);
                            card.classList.add('search-match');
                        }
                    } catch (e) {}
                }
            });

            if (searchResults.length > 0) {
                currentSearchIndex = 0;
                focusSearchResult();
            }
        }

        function focusSearchResult() {
            if (searchResults.length === 0 || currentSearchIndex < 0) return;
            
            const targetCard = searchResults[currentSearchIndex];
            
            const cardRect = targetCard.getBoundingClientRect();
            const treeRect = treeTransform.getBoundingClientRect();
            const containerRect = scrollContainer.getBoundingClientRect();
            
            const cardCenterX = (cardRect.left - treeRect.left) + (cardRect.width / 2);
            const cardCenterY = (cardRect.top - treeRect.top) + (cardRect.height / 2);
            
            scrollContainer.scrollTo({
                left: cardCenterX - (containerRect.width / 2),
                top: cardCenterY - (containerRect.height / 2),
                behavior: 'smooth'
            });
            
            // Trigger click simulation to show person details perfectly
            if (!targetCard.classList.contains('highlighted')) {
                 targetCard.click();
            }
        }

        function navigateSearch(direction) {
            if (searchResults.length === 0) return;
            currentSearchIndex += direction;
            if (currentSearchIndex < 0) currentSearchIndex = searchResults.length - 1;
            if (currentSearchIndex >= searchResults.length) currentSearchIndex = 0;
            focusSearchResult();
        }

        searchInput.addEventListener('input', performSearch);

        btnSearchClear.addEventListener('click', () => {
            searchInput.value = '';
            performSearch();
            searchInput.focus();
        });
        
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                navigateSearch(e.shiftKey ? -1 : 1);
            }
        });

        btnSearchPrev.addEventListener('click', () => navigateSearch(-1));
        btnSearchNext.addEventListener('click', () => navigateSearch(1));

        // Initial Execution
        loadAndRenderTree();
    });
    </script>
</body>
</html>
