<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLite Family Tree Viewer (V2)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons via reliable CDN -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <!-- sql.js for SQLite in the browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.min.js"></script>

    <style>
        /* --- CSS for the Tree Layout ---
           Cards are laid out with computed absolute positions (see the tidy-tree
           layout functions in the script below), not nested-flexbox centering, so
           there is no ul/li structure here — every connector line (parent-child,
           marriage) is drawn as an SVG path in #cross-tree-links instead. */
        .tree-container {
            display: inline-block;
            will-change: transform;
        }

        /* Node card transitions */
        .tree-node-card {
            transition: all 0.2s ease-in-out;
        }
        .tree-node-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        .tree-node-card.highlighted {
            border-color: var(--highlight-color, #3b82f6);
            box-shadow: var(--highlight-shadow, 0 0 0 4px rgba(59, 130, 246, 0.3));
        }
        .tree-node-card.highlighted-gen {
            border-color: var(--highlight-color);
        }

        /* Hide Scrollbars */
        .custom-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .custom-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        /* Search Matches */
        .tree-node-card.search-match {
            outline: 4px solid var(--search-color, #f59e0b);
            outline-offset: 3px;
            box-shadow: 0 0 15px var(--search-color, rgba(245, 158, 11, 0.5));
        }

        /* Glowing bloodline-path lines, drawn as SVG paths */
        .svg-glow-line {
            stroke: #1e293b !important;
            filter: drop-shadow(0 0 3px rgba(30, 41, 59, 0.4));
        }

        /* Highlighted Spouse Styling */
        .tree-node-card.highlighted-spouse {
            border-color: var(--highlight-color, #94a3b8);
        }
    </style>
</head>
<body class="w-full h-screen bg-slate-50 font-sans text-slate-800 m-0 overflow-hidden relative flex bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] select-none">

    <!-- Main Tree Content -->
    <div class="flex-1 relative h-full overflow-hidden">
        <!-- Error Overlay -->
        <div id="error-overlay" class="hidden absolute top-4 left-1/2 -translate-x-1/2 z-50 bg-red-50 text-red-600 px-6 py-4 rounded-xl shadow-lg border border-red-200 flex items-center gap-3 max-w-2xl">
            <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0"></i>
            <span id="error-text" class="break-words w-full text-sm font-medium"></span>
        </div>

        <!-- Tree Canvas area -->
        <div id="scroll-container" class="w-full h-full overflow-auto p-8 custom-scrollbar cursor-grab">
            <!-- The explicit scale wrapper that prevents scroll clipping -->
            <div id="scale-wrapper" class="mx-auto relative" style="width: auto; height: auto;">
                <div 
                    id="tree-transform"
                    class="tree-container absolute top-0 left-0 w-max"
                    style="transform-origin: top left; transform: scale(1);"
                >
                    <svg id="cross-tree-links" class="absolute top-0 left-0 w-full h-full pointer-events-none overflow-visible" style="z-index: 0;"></svg>
                    <div id="tree-root" class="w-max mx-auto relative z-10">
                        <!-- Tree will be rendered here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Right Sidebar for Controls & Legend -->
    <div class="w-[180px] h-full bg-slate-50/95 backdrop-blur border-l border-slate-200 shadow-xl flex flex-col p-4 z-20 shrink-0">
        
        <!-- Toolbar -->
        <div class="flex bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden items-center justify-center mb-4 shrink-0">
            <button id="btn-zoom-out" class="p-2 hover:bg-slate-100 text-slate-600 transition-colors cursor-pointer flex-1 flex justify-center" title="Zoom Out">
                <i data-lucide="zoom-out" class="w-5 h-5"></i>
            </button>
            <button id="btn-zoom-reset" class="p-2 hover:bg-slate-100 text-slate-600 border-x border-slate-200 transition-colors cursor-pointer flex-1 flex justify-center" title="Reset Zoom">
                <i data-lucide="maximize" class="w-5 h-5"></i>
            </button>
            <button id="btn-zoom-in" class="p-2 hover:bg-slate-100 text-slate-600 transition-colors cursor-pointer flex-1 flex justify-center" title="Zoom In">
                <i data-lucide="zoom-in" class="w-5 h-5"></i>
            </button>
            <button id="btn-focus" class="p-2 hover:bg-slate-100 text-slate-600 border-l border-slate-200 transition-colors cursor-pointer flex-1 flex justify-center" title="Focus">
                <i data-lucide="focus" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Search -->
        <div class="flex bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden items-center justify-center mb-6 shrink-0">
            <input type="text" id="search-input" placeholder="Ara..." class="w-full px-3 py-2 text-sm outline-none bg-transparent placeholder-slate-400 text-slate-700">
            <button id="btn-search-clear" class="p-2 hover:bg-slate-100 text-slate-400 hover:text-slate-600 transition-colors cursor-pointer hidden justify-center shrink-0" title="Temizle">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
            <button id="btn-search-prev" class="p-2 hover:bg-slate-100 text-slate-600 border-l border-slate-200 transition-colors cursor-pointer flex justify-center shrink-0" title="Önceki Sonuç">
                <i data-lucide="chevron-up" class="w-4 h-4"></i>
            </button>
            <button id="btn-search-next" class="p-2 hover:bg-slate-100 text-slate-600 border-l border-slate-200 transition-colors cursor-pointer flex justify-center shrink-0" title="Sonraki Sonuç">
                <i data-lucide="chevron-down" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Person Details Panel -->
        <div id="person-details-panel" class="bg-white rounded-lg shadow-sm border border-slate-200 p-3 hidden flex-col shrink-0 mb-4">
            <div class="font-semibold text-slate-700 text-[11px] uppercase tracking-wider mb-2 pb-2 border-b border-slate-200 flex justify-between items-center shrink-0">
                <span>Kişi Detayları</span>
                <div class="flex items-center gap-1.5">
                    <button id="btn-close-details" class="p-1 -mr-1 hover:bg-slate-100 text-slate-400 hover:text-slate-600 rounded transition-colors cursor-pointer" title="Kapat">
                        <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            </div>
            <div id="person-details-content" class="flex flex-col gap-2 text-xs text-slate-600">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Generation Color Legend -->
        <div id="generation-legend" class="bg-white rounded-lg shadow-sm border border-slate-200 p-3 hidden flex-col flex-1 min-h-0 overflow-hidden">
            <div class="font-semibold text-slate-700 text-[11px] uppercase tracking-wider mb-2 pb-2 border-b border-slate-200 flex justify-between items-center shrink-0">
                <span>Nesiller</span>
            </div>
            <div id="legend-list" class="flex flex-col gap-2 text-xs text-slate-600 overflow-y-auto custom-scrollbar pr-1 pb-1">
                <!-- Populated by JS -->
            </div>
            <div id="legend-note" class="mt-2 pt-2 border-t border-slate-200 text-[10px] text-slate-400 text-center italic hidden shrink-0">
                16+ başa döner
            </div>
        </div>
        
        <!-- Minimap -->
        <div id="minimap-wrapper" class="bg-white rounded-lg shadow-sm border border-slate-200 p-3 hidden flex-col shrink-0 h-[180px] mt-4">
            <div class="font-semibold text-slate-700 text-[11px] uppercase tracking-wider mb-2 pb-2 border-b border-slate-200 flex justify-between items-center shrink-0">
                <span>Mini Harita</span>
                <i data-lucide="map" class="w-3.5 h-3.5 text-slate-400"></i>
            </div>
            <div id="minimap-container" class="relative w-full flex-1 bg-slate-50 overflow-hidden border border-slate-200 rounded cursor-crosshair">
                <canvas id="minimap-canvas" class="absolute top-0 left-0 w-full h-full"></canvas>
                <div id="minimap-viewport" class="absolute border-2 border-blue-500 bg-blue-500/20 pointer-events-none transition-none shadow-[0_0_0_9999px_rgba(0,0,0,0.25)]" style="display: none;"></div>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        
        // Setup global error handling so you don't have to check the console
        window.onerror = function(message, source, lineno, colno, error) {
            const errDiv = document.getElementById('error-overlay');
            const errTxt = document.getElementById('error-text');
            if(errDiv && errTxt) {
                errDiv.classList.remove('hidden');
                errTxt.textContent = `System Error: ${message}`;
            }
            return false; 
        };

        // Check if Lucide loaded correctly from the CDN
        if (typeof lucide === 'undefined') {
            throw new Error("Lucide Icons CDN failed to load. Please check your network or adblocker.");
        }

        // DOM Elements
        const errorOverlay = document.getElementById('error-overlay');
        const errorText = document.getElementById('error-text');
        const treeRoot = document.getElementById('tree-root');
        const treeTransform = document.getElementById('tree-transform');
        const scrollContainer = document.getElementById('scroll-container');
        
        const btnZoomIn = document.getElementById('btn-zoom-in');
        const btnZoomOut = document.getElementById('btn-zoom-out');
        const btnZoomReset = document.getElementById('btn-zoom-reset');
        const btnFocus = document.getElementById('btn-focus');

        const searchInput = document.getElementById('search-input');
        const btnSearchClear = document.getElementById('btn-search-clear');
        const btnSearchPrev = document.getElementById('btn-search-prev');
        const btnSearchNext = document.getElementById('btn-search-next');

        const personDetailsPanel = document.getElementById('person-details-panel');
        const personDetailsContent = document.getElementById('person-details-content');
        const btnCloseDetails = document.getElementById('btn-close-details');

        const generationLegend = document.getElementById('generation-legend');
        const legendList = document.getElementById('legend-list');

        const minimapWrapper = document.getElementById('minimap-wrapper');
        const minimapContainer = document.getElementById('minimap-container');
        const minimapCanvas = document.getElementById('minimap-canvas');
        const minimapViewport = document.getElementById('minimap-viewport');

        // State
        let currentZoom = 1;
        let isFocusMode = false;
        let searchResults = [];
        let currentSearchIndex = -1;
        let originalRoots = []; // full (unfocused) hierarchy, set once after load

        // Tidy-tree layout output, keyed by person id. Recomputed by
        // computeTreeLayout() on every render (initial load + focus toggle).
        let personLayoutX = new Map();
        let personRenderGeneration = new Map();
        let personRootColor = new Map();

        // Initialize Lucide Icons on load
        lucide.createIcons();

        // Utility: Escape HTML to prevent XSS and rendering issues
        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // 15 birbirinden tamamen farklı ve zıt renk. (Global Scope)
        // Modulo (%) operatörü ile 15'ten derin ağaçlarda başa sararak sınırsız derinlik destekler.
        const generationColors = [
            { hex: '#ef4444', rgba: 'rgba(239, 68, 68, 0.3)' },   // 1: Kırmızı
            { hex: '#3b82f6', rgba: 'rgba(59, 130, 246, 0.3)' },  // 2: Mavi
            { hex: '#22c55e', rgba: 'rgba(34, 197, 94, 0.3)' },   // 3: Yeşil
            { hex: '#f97316', rgba: 'rgba(249, 115, 22, 0.3)' },  // 4: Turuncu
            { hex: '#a855f7', rgba: 'rgba(168, 85, 247, 0.3)' },  // 5: Mor
            { hex: '#06b6d4', rgba: 'rgba(6, 182, 212, 0.3)' },   // 6: Camgöbeği
            { hex: '#eab308', rgba: 'rgba(234, 179, 8, 0.3)' },   // 7: Sarı
            { hex: '#ec4899', rgba: 'rgba(236, 72, 153, 0.3)' },  // 8: Pembe
            { hex: '#84cc16', rgba: 'rgba(132, 204, 22, 0.3)' },  // 9: Limon Yeşili
            { hex: '#6366f1', rgba: 'rgba(99, 102, 241, 0.3)' },  // 10: Çivit Mavisi
            { hex: '#14b8a6', rgba: 'rgba(20, 184, 166, 0.3)' },  // 11: Turkuaz
            { hex: '#f43f5e', rgba: 'rgba(244, 63, 94, 0.3)' },   // 12: Gül Rengi
            { hex: '#f59e0b', rgba: 'rgba(245, 158, 11, 0.3)' },  // 13: Kehribar
            { hex: '#10b981', rgba: 'rgba(16, 185, 129, 0.3)' },  // 14: Zümrüt
            { hex: '#64748b', rgba: 'rgba(100, 116, 139, 0.3)' }  // 15: Arduvaz (Gri-Mavi)
        ];

        // Per-independent-root-tree line color (a root is a person with no recorded
        // parents; two roots only linked via a marriage further down still each get
        // their own color so the connecting cross-tree line is easy to trace).
        const treeLineColors = [
            '#64748b', // 1: Arduvaz (Default)
            '#78716c', // 2: Taş / Sıcak Gri (Stone 500)
            '#0f766e', // 3: Koyu Turkuaz (Teal 700)
            '#9f1239', // 4: Koyu Gül / Bordo (Rose 800)
            '#4338ca', // 5: Koyu İndigo (Indigo 700)
            '#4d7c0f', // 6: Koyu Zeytin Yeşili (Lime 700)
            '#a21caf', // 7: Koyu Eflatun (Fuchsia 700)
            '#b45309', // 8: Koyu Kehribar / Kahve (Amber 700)
            '#334155'  // 9: Koyu Arduvaz (Slate 700)
        ];

        // Utility: Parse ID lists safely
        function parseIds(value) {
            if (!value) return [];
            if (Array.isArray(value)) return value;
            try { return JSON.parse(value); } 
            catch(e) { return [value]; }
        }

        // Utility: Generate HTML for a person's card to prevent code duplication
        function generateCardHTML(person, isSpouse = false) {
            if (!person) return '';
            const cardClass = isSpouse ? 'spouse-card' : 'direct-relative-card';
            const personIdAttr = person.id ? `data-id="${person.id}"` : '';
            const parentIdsAttr = (person._parentIds && person._parentIds.length > 0) ? `data-parent-ids="${person._parentIds.join(',')}"` : '';
            const spouseIdsAttr = (person._spouseIds && person._spouseIds.length > 0) ? `data-spouse-ids="${person._spouseIds.join(',')}"` : '';
            const genAttr = person._generation ? `data-generation="${person._generation}"` : '';
            
            const personDetails = { name: person.name, id: person.id, photoUrl: person.photoUrl, attributes: person.attributes };
            const detailsAttr = `data-details="${escapeHTML(JSON.stringify(personDetails))}"`;

            const name = person.name || "UNKNOWN";
            const surname = (person.attributes && person.attributes.surname) ? person.attributes.surname : '';

            const gender = (person.attributes && person.attributes.gender) ? person.attributes.gender : '';
            let genderBar = '';
            if (gender === 'Male') {
                genderBar = '<div class="absolute top-0 left-0 w-full h-1 bg-sky-400/50"></div>';
            } else if (gender === 'Female') {
                genderBar = '<div class="absolute top-0 left-0 w-full h-1 bg-rose-400/50"></div>';
            }

            let portraitHtml = '';
            if (person.photoUrl) {
                portraitHtml = `<img src="${escapeHTML(person.photoUrl)}" alt="${escapeHTML(name)}" class="w-16 h-16 rounded-full object-cover mx-auto mb-2 border-2 border-slate-100 shadow-sm shrink-0">`;
            } else {
                portraitHtml = `<div class="w-16 h-16 rounded-full bg-slate-50 mx-auto mb-2 flex items-center justify-center border-2 border-slate-100 shadow-sm shrink-0"><i data-lucide="user" class="w-8 h-8 text-slate-300"></i></div>`;
            }

            let html = `<div ${personIdAttr} ${parentIdsAttr} ${spouseIdsAttr} ${genAttr} ${detailsAttr} class="tree-node-card ${cardClass} bg-white border-2 border-slate-300 rounded-xl p-4 shadow-sm w-[200px] min-h-[10em] text-center absolute z-10 cursor-pointer min-w-0 h-fit overflow-hidden">
                ${genderBar}
                ${portraitHtml}
                <h3 class="font-bold text-slate-900 text-lg hover:opacity-80 transition-opacity ${!surname ? 'mb-1' : ''}">${escapeHTML(name)}</h3>`;
            if (surname) {
                html += `<div class="font-semibold text-slate-700 text-base -mt-1 mb-1">${escapeHTML(surname)}</div>`;
            }
            html += `<div class="text-[10px] text-slate-400 font-mono mb-1">ID: ${escapeHTML(person.id)}</div>`;

            const displayAttributes = Object.keys(person.attributes || {}).filter(k => k !== 'surname' && k !== 'gender');
            if (displayAttributes.length > 0) {
                html += `<div class="mt-2 flex flex-col gap-1 text-xs text-slate-600">`;
                for (const key of displayAttributes) {
                    const value = person.attributes[key];
                    if (key === 'note') {
                        html += `
                            <div class="bg-amber-50 px-2 py-1.5 rounded-md text-left whitespace-normal break-words mt-1 border border-amber-100">
                                <span class="font-semibold text-slate-800 capitalize">${escapeHTML(key)}:</span> ${escapeHTML(value)}
                            </div>`;
                    } else {
                        html += `
                            <div class="bg-white/70 px-2 py-1 rounded-md text-left whitespace-normal break-words" title="${escapeHTML(key)}: ${escapeHTML(value)}">
                                <span class="font-semibold text-slate-800 capitalize">${escapeHTML(key)}:</span> ${escapeHTML(value)}
                            </div>`;
                    }
                }
                html += `</div>`;
            }
            
            html += `</div>`;
            return html;
        }


        // Transform flat SQL-like data into the hierarchical format
        function buildHierarchy(flatData) {
            const nodeMap = new Map();
            
            // First pass: create node objects and map them
            flatData.forEach(row => {
                const node = {
                    id: row.id,
                    name: row.name,
                    photoUrl: row.photoUrl,
                    attributes: {},
                    _parentIds: [],
                    _spouseIds: [],
                    _visited: false,
                    _addedAsChild: false,
                    _generation: null
                };
                
                node._parentIds = parseIds(row.parentIds);
                node._spouseIds = parseIds(row.spouseIds);
                
                if (row.surname) node.attributes.surname = row.surname;
                if (row.birthplace) node.attributes.birthplace = row.birthplace;
                if (row.birthdate) node.attributes.birthdate = row.birthdate;
                if (row.gender === 1) node.attributes.gender = 'Male';
                if (row.gender === 2) node.attributes.gender = 'Female';
                if (row.note) node.attributes.note = row.note;
                
                nodeMap.set(Number(row.id), node);
            });

            // Hızlı erişim için çocuk haritası oluşturma (O(1) lookup)
            const childMap = new Map();
            nodeMap.forEach(n => {
                n._parentIds.forEach(pid => {
                    const pNum = Number(pid);
                    if (!childMap.has(pNum)) childMap.set(pNum, []);
                    childMap.get(pNum).push(n);
                });
            });

            // Global Jenerasyon Senkronizasyonu (Tüm farklı kökleri ve çapraz bağları hizalar)
            nodeMap.forEach((startNode) => {
                if (startNode._generation !== null) return; // Zaten işlenmişse atla
                
                startNode._generation = 0;
                const queue = [startNode];
                const componentNodes = [startNode];
                
                while(queue.length > 0) {
                    const current = queue.shift();
                    
                    // Çocuklara jenerasyon (n + 1) ata
                    const children = childMap.get(Number(current.id)) || [];
                    children.forEach(child => {
                        if (child._generation === null) {
                            child._generation = current._generation + 1;
                            queue.push(child);
                            componentNodes.push(child);
                        }
                    });
                    
                    // Ebeveynlere jenerasyon (n - 1) ata
                    current._parentIds.forEach(pid => {
                        const parent = nodeMap.get(Number(pid));
                        if (parent && parent._generation === null) {
                            parent._generation = current._generation - 1;
                            queue.push(parent);
                            componentNodes.push(parent);
                        }
                    });
                    
                    // Eşlere aynı jenerasyonu ata
                    current._spouseIds.forEach(sid => {
                        const spouse = nodeMap.get(Number(sid));
                        if (spouse && spouse._generation === null) {
                            spouse._generation = current._generation;
                            queue.push(spouse);
                            componentNodes.push(spouse);
                        }
                    });
                }
                
                // En düşük jenerasyonun 1 olmasını sağlayarak değerleri normalize et
                const minGen = Math.min(...componentNodes.map(n => n._generation));
                const offset = 1 - minGen;
                componentNodes.forEach(n => n._generation += offset);
            });

            // Jenerasyon Tutarlılık Düzeltmesi (Relaxation Pass)
            // BFS, eşler arası jenerasyon farkı olan (örn. akraba evliliği/yaş farkı büyük evlilikler)
            // durumlarda gezinme sırasına bağlı olarak kardeşlere farklı jenerasyon numaraları
            // atayabiliyordu (aynı ebeveynlerin çocukları farklı jenerasyonlarda görünüyordu).
            // Bu döngü, her çocuğun jenerasyonunun ebeveynlerinden en az 1 fazla olmasını garanti
            // ederek Focus modundaki dikey hizalama bozukluklarını giderir.
            let genChanged = true;
            let genIterations = 0;
            const maxGenIterations = nodeMap.size + 5;
            while (genChanged && genIterations < maxGenIterations) {
                genChanged = false;
                genIterations++;
                nodeMap.forEach(node => {
                    node._parentIds.forEach(pid => {
                        const parent = nodeMap.get(Number(pid));
                        if (parent) {
                            const desired = parent._generation + 1;
                            if (node._generation < desired) {
                                node._generation = desired;
                                genChanged = true;
                            }
                        }
                    });
                });
            }

            const roots = [];
            nodeMap.forEach(node => {
                // Nodes with no parents, or whose parents don't exist in the dataset, are roots
                const hasExistingParent = node._parentIds.some(pid => nodeMap.has(Number(pid)));
                if (!hasExistingParent) {
                    // Prevent nodes that are just spouses of someone with parents from becoming independent roots
                    const hasSpouseWithParent = node._spouseIds.some(spouseId => {
                        const spouse = nodeMap.get(Number(spouseId));
                        return spouse && spouse._parentIds.some(pid => nodeMap.has(Number(pid)));
                    });
                    
                    if (!hasSpouseWithParent) {
                        roots.push(node);
                    }
                }
            });

            function buildNode(nodeId, asSpouse = false) {
                const node = nodeMap.get(Number(nodeId));
                if (!node) return null;
                
                // If already visited, return null to prevent duplication and cycles
                if (node._visited) return null; 
                node._visited = true;

                const result = { 
                    id: node.id,
                    _parentIds: node._parentIds,
                    _spouseIds: node._spouseIds,
                    _generation: node._generation,
                    name: node.name, 
                    photoUrl: node.photoUrl,
                    attributes: { ...node.attributes }, 
                    children: [], 
                    spouses: [] 
                };

                // 1. Claim direct children first so they fall under the correct parent
                const children = childMap.get(Number(node.id)) || [];
                children.forEach(potentialChild => {
                    if (!potentialChild._addedAsChild) {
                        potentialChild._addedAsChild = true;
                        const childNode = buildNode(potentialChild.id, false);
                        if (childNode) result.children.push(childNode);
                    }
                });

                // 2. Attach spouses
                if (!asSpouse) {
                    node._spouseIds.forEach(spouseId => {
                        const spouseNode = buildNode(spouseId, true);
                        if (spouseNode) result.spouses.push(spouseNode);
                    });
                }
                return result;
            }

            return roots.map(root => buildNode(root.id, false)).filter(Boolean);
        }

        // --- Tidy-tree layout ---
        // Cards are fixed-width (200px) and only vary in height, so the X layout is
        // a pure function of the hierarchy (buildHierarchy's output) with no DOM
        // measurement needed. Y is generation-driven: every row's height is measured
        // once after render, then each card is placed at the cumulative Y for its
        // own generation — so a card's vertical position always matches its real
        // generation, regardless of how deep it happens to sit in the DOM/hierarchy.
        //
        // The X algorithm is a Reingold-Tilford/Walker-style "tidy tree": a parent
        // centers over the midpoint of its immediate children (not the full width of
        // its entire subtree), and sibling subtrees are packed as tightly as contour
        // comparison allows *at every generation*, not just their own row. That's
        // what lets a short sibling's subtree end early and a neighboring deep
        // sibling's much wider lower generations slide in closer, instead of
        // reserving dead rectangular space the way naive nested-flexbox centering
        // does (the original bug this replaces).
        const CARD_WIDTH = 200;
        const INLINE_SPOUSE_GAP = 40;   // gap between a person and an inline childless spouse
        const COLUMN_GAP = 60;          // gap between a person's column and a spouse-with-children column
        const SIBLING_GAP = 60;         // gap between different children (family units) of the same parent
        const ROOT_GAP = 120;           // gap between independent top-level root trees
        const ROW_GAP = 70;             // vertical gap between generation rows

        // Merge a contour (Map<generation, {min,max}>), shifted by shiftX, into an
        // accumulator contour in place.
        function mergeContourInto(acc, contour, shiftX) {
            contour.forEach((range, gen) => {
                const min = range.min + shiftX;
                const max = range.max + shiftX;
                const prior = acc.get(gen);
                if (prior) {
                    acc.set(gen, { min: Math.min(prior.min, min), max: Math.max(prior.max, max) });
                } else {
                    acc.set(gen, { min, max });
                }
            });
        }

        // Pack a left-to-right sequence of items (each { width, contour }) as
        // tightly as contour comparison allows: for each item, find the minimal
        // rightward shift so its own contour doesn't overlap everything already
        // placed, checked at every generation they share (not just the top row).
        function packSiblingsContour(items, desiredGap) {
            const offsets = [];
            const combined = new Map();
            items.forEach((item, i) => {
                let shift = 0;
                if (i > 0) {
                    item.contour.forEach((range, gen) => {
                        const prior = combined.get(gen);
                        if (prior) {
                            const needed = prior.max + desiredGap - range.min;
                            if (needed > shift) shift = needed;
                        }
                    });
                }
                offsets.push(shift);
                mergeContourInto(combined, item.contour, shift);
            });
            let width = 0;
            combined.forEach(range => { if (range.max > width) width = range.max; });
            return { offsets, contour: combined, width };
        }

        // One column = one person's own card (+ any inline childless spouses
        // widening it) plus their own children, laid out as family units below.
        // Returns local coordinates (relative to this column's own frame, origin 0).
        function layoutColumn(person) {
            const childUnits = (person.children || []).map(child => layoutFamilyUnit(child));
            const packed = childUnits.length
                ? packSiblingsContour(childUnits.map(u => ({ width: u.width, contour: u.contour })), SIBLING_GAP)
                : null;

            const inlineSpouses = (person.spouses || []).filter(s => !s.children || s.children.length === 0);
            // The combined row is NOT symmetric around the person's own card: it
            // starts at the person's card and extends rightward through each
            // inline spouse, so its right edge is CARD_WIDTH further per spouse —
            // not centered on ownX the way a plain width/2 split would assume.
            const rowRightExtent = CARD_WIDTH + inlineSpouses.length * (CARD_WIDTH + INLINE_SPOUSE_GAP);
            // Children should hang centered under the whole marriage (this
            // person's card plus any inline spouses), not just this person's own
            // card — otherwise a couple's descendants visibly skew toward
            // whichever parent happens to be "person" vs "spouse" in the data.
            // This is the offset from ownX to the row's true center.
            const rowCenterOffset = rowRightExtent / 2 - CARD_WIDTH / 2;

            let ownX;
            const contour = new Map();
            if (packed) {
                const firstAnchor = packed.offsets[0] + childUnits[0].anchorX;
                const lastAnchor = packed.offsets[packed.offsets.length - 1] + childUnits[childUnits.length - 1].anchorX;
                const midpoint = (firstAnchor + lastAnchor) / 2;
                const desiredOwnX = midpoint - rowCenterOffset;
                // Don't let the person's own card (or, if shifted left for the
                // centering above, the row) poke past the left edge of the frame.
                const frameShift = Math.max(0, CARD_WIDTH / 2 - desiredOwnX);
                ownX = desiredOwnX + frameShift;
                mergeContourInto(contour, packed.contour, frameShift);
                childUnits.forEach((u, i) => { u.finalOffset = packed.offsets[i] + frameShift; });
            } else {
                ownX = CARD_WIDTH / 2;
            }
            // Safe to set directly (not merge): a child's generation is always
            // strictly greater than its parent's, so this key is never already present.
            contour.set(person._generation, { min: ownX - CARD_WIDTH / 2, max: ownX - CARD_WIDTH / 2 + rowRightExtent });

            const spouseX = new Map();
            let cursor = ownX + CARD_WIDTH / 2;
            inlineSpouses.forEach(spouse => {
                cursor += INLINE_SPOUSE_GAP;
                spouseX.set(spouse.id, cursor + CARD_WIDTH / 2);
                cursor += CARD_WIDTH;
            });

            let width = ownX - CARD_WIDTH / 2 + rowRightExtent;
            contour.forEach(r => { if (r.max > width) width = r.max; });

            return { person, ownX, spouseX, childUnits, width, contour };
        }

        // A family unit is one entry in a parent's children[] list: the child's own
        // column plus any of THEIR spouses-with-children, side by side at the same row.
        function layoutFamilyUnit(person) {
            const spousesWithChildren = (person.spouses || []).filter(s => s.children && s.children.length > 0);
            const columns = [layoutColumn(person), ...spousesWithChildren.map(s => layoutColumn(s))];
            const packed = columns.length > 1
                ? packSiblingsContour(columns.map(c => ({ width: c.width, contour: c.contour })), COLUMN_GAP)
                : { offsets: [0], contour: columns[0].contour, width: columns[0].width };

            columns.forEach((c, i) => { c.finalOffset = packed.offsets[i]; });

            const firstX = packed.offsets[0] + columns[0].ownX;
            const lastX = packed.offsets[packed.offsets.length - 1] + columns[columns.length - 1].ownX;
            const anchorX = (firstX + lastX) / 2;

            return { person, columns, anchorX, width: packed.width, contour: packed.contour };
        }

        // Top-down pass: convert the local offsets computed above into absolute
        // page-space X, writing into the module-level lookup maps.
        function recordColumn(col, originX, rootColor) {
            personLayoutX.set(col.person.id, originX + col.ownX);
            personRenderGeneration.set(col.person.id, col.person._generation);
            personRootColor.set(col.person.id, rootColor);
            col.spouseX.forEach((x, spouseId) => {
                personLayoutX.set(spouseId, originX + x);
                // An inline childless spouse has no subtree of their own to keep
                // consistent, so render them on their anchor partner's row.
                personRenderGeneration.set(spouseId, col.person._generation);
                personRootColor.set(spouseId, rootColor);
            });
            col.childUnits.forEach(unit => {
                assignAbsolutePositions(unit, originX + unit.finalOffset, rootColor);
            });
        }

        function assignAbsolutePositions(familyUnit, originX, rootColor) {
            familyUnit.columns.forEach(col => {
                recordColumn(col, originX + col.finalOffset, rootColor);
            });
        }

        // Runs the full X layout over the (possibly pruned) hierarchy and populates
        // personLayoutX / personRenderGeneration / personRootColor. Returns the
        // total width needed, in local pixels (pre-zoom).
        function computeTreeLayout(roots) {
            personLayoutX = new Map();
            personRenderGeneration = new Map();
            personRootColor = new Map();

            if (roots.length === 0) return { totalWidth: 0 };

            const rootUnits = roots.map(r => layoutFamilyUnit(r));
            const packed = rootUnits.length > 1
                ? packSiblingsContour(rootUnits.map(u => ({ width: u.width, contour: u.contour })), ROOT_GAP)
                : { offsets: [0] };

            rootUnits.forEach((unit, i) => {
                const color = treeLineColors[i % treeLineColors.length];
                assignAbsolutePositions(unit, packed.offsets[i], color);
            });

            let totalWidth = 0;
            rootUnits.forEach((unit, i) => {
                const right = packed.offsets[i] + unit.width;
                if (right > totalWidth) totalWidth = right;
            });
            return { totalWidth };
        }

        // Flatten the hierarchy into every rendered person once (each person
        // appears exactly once in buildHierarchy's output, as either a child or a
        // spouse entry somewhere).
        function collectAllPersons(roots) {
            const result = [];
            function visit(person, isSpouse) {
                result.push({ person, isSpouse });
                (person.children || []).forEach(child => visit(child, false));
                (person.spouses || []).forEach(spouse => visit(spouse, true));
            }
            roots.forEach(r => visit(r, false));
            return result;
        }

        // Measures each currently-rendered card's natural height, groups by its
        // render generation, and places every card at the cumulative Y for that
        // generation. Safe to call repeatedly (e.g. on resize) without recomputing X.
        function remeasureY() {
            const cards = Array.from(document.querySelectorAll('.tree-node-card[data-id]'));
            if (cards.length === 0) {
                treeRoot.style.height = '0px';
                return;
            }

            const genRowHeight = {};
            const cardGen = new Map();
            cards.forEach(card => {
                const id = Number(card.getAttribute('data-id'));
                const gen = personRenderGeneration.get(id);
                if (gen === undefined) return;
                cardGen.set(card, gen);
                const h = card.offsetHeight;
                if (!genRowHeight[gen] || h > genRowHeight[gen]) genRowHeight[gen] = h;
            });

            const gens = Object.keys(genRowHeight).map(Number).sort((a, b) => a - b);
            const cumulativeY = {};
            let y = 0;
            gens.forEach(g => {
                cumulativeY[g] = y;
                y += genRowHeight[g] + ROW_GAP;
            });
            const totalHeight = y > 0 ? y - ROW_GAP : 0;

            cards.forEach(card => {
                const gen = cardGen.get(card);
                if (gen === undefined) return;
                card.style.top = cumulativeY[gen] + 'px';
            });

            treeRoot.style.height = totalHeight + 'px';
        }

        // Resolves once Tailwind has actually applied its utility-class CSS to
        // freshly-inserted cards. Tailwind's CDN build (<script src=
        // "cdn.tailwindcss.com">) injects utility-class rules asynchronously — a
        // MutationObserver reacts to this innerHTML swap — so cards can report
        // the wrong (unstyled) size/position if measured too soon. How long that
        // takes varies by browser and by how many new elements just landed (535
        // cards at once): one animation frame is enough in some browsers but not
        // reliably in others (confirmed: Safari needed more than the single rAF
        // this used to wait), so poll actual computed style instead of guessing
        // a fixed frame count — wait until a known utility class's effect
        // (w-[200px]) is actually visible on a real card, with a generous cap so
        // a genuine failure doesn't hang forever.
        function waitForCardStyles() {
            return new Promise(resolve => {
                let attempts = 0;
                function check() {
                    const card = treeRoot.querySelector('.tree-node-card');
                    attempts++;
                    const expectedWidth = CARD_WIDTH * currentZoom;
                    if (!card || Math.abs(card.getBoundingClientRect().width - expectedWidth) < 1 || attempts > 120) {
                        resolve();
                    } else {
                        requestAnimationFrame(check);
                    }
                }
                requestAnimationFrame(check);
            });
        }

        // Re-attached on every render since it needs to observe whatever cards
        // currently exist — a fresh set after each full re-render (initial load,
        // focus mode toggling).
        let activeResizeObserver = null;
        function attachResizeObserver() {
            if (activeResizeObserver) activeResizeObserver.disconnect();
            let resizeTimeout = null;
            activeResizeObserver = new ResizeObserver(() => {
                if (resizeTimeout) clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    remeasureY();
                    drawCrossTreeLinks();
                    drawMinimap();
                }, 50);
            });
            document.querySelectorAll('.tree-node-card').forEach(card => activeResizeObserver.observe(card));
        }

        // Full render pipeline: compute X layout, emit flat absolutely-positioned
        // cards, apply X, measure+apply Y, size the container, draw connectors.
        async function renderTreeFromHierarchy(roots) {
            const { totalWidth } = computeTreeLayout(roots);

            const persons = collectAllPersons(roots);
            let html = '';
            persons.forEach(({ person, isSpouse }) => { html += generateCardHTML(person, isSpouse); });
            treeRoot.innerHTML = html;
            lucide.createIcons();

            document.querySelectorAll('.tree-node-card[data-id]').forEach(card => {
                const id = Number(card.getAttribute('data-id'));
                const x = personLayoutX.get(id);
                if (x !== undefined) card.style.left = (x - CARD_WIDTH / 2) + 'px';
            });

            treeRoot.style.width = totalWidth + 'px';

            // Wait for Tailwind to finish styling the new cards (see
            // waitForCardStyles's comment) before measuring heights — otherwise
            // row heights, Y positions, and every connector line get computed
            // against temporarily-unstyled (wrong) card sizes and never get
            // corrected.
            await waitForCardStyles();

            remeasureY();
            drawCrossTreeLinks();
            attachResizeObserver();
        }

        // For focus mode: keep only people in visibleIds, promoting any visible
        // descendant to its own top-level entry when its real ancestor isn't
        // visible (rather than dropping it, since there's no DOM nesting to hang
        // it from anymore).
        function pruneForFocus(persons, visibleIds) {
            const out = [];
            persons.forEach(person => {
                const childResults = pruneForFocus(person.children || [], visibleIds);
                const spouseResults = (person.spouses || [])
                    .filter(s => visibleIds.has(s.id))
                    .map(s => ({ ...s, children: pruneForFocus(s.children || [], visibleIds) }));
                if (visibleIds.has(person.id)) {
                    out.push({ ...person, children: childResults, spouses: spouseResults });
                } else {
                    out.push(...childResults);
                    spouseResults.forEach(s => { if (s.children.length) out.push(s); });
                }
            });
            return out;
        }


        // --- Cross Tree Linking Logic ---
        function drawCrossLink(svg, x1, y1, x2, y2, type, color = '#94a3b8', sharedMidY = null, isGlowing = false) {
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            
            let d = '';
            
            if (type === 'parent-child') {
                const midY = sharedMidY !== null ? sharedMidY : (y1 + y2) / 2;
                d = `M ${x1},${y1} L ${x1},${midY} L ${x2},${midY} L ${x2},${y2}`;
            } else {
                const midX = (x1 + x2) / 2;
                d = `M ${x1},${y1} L ${midX},${y1} L ${midX},${y2} L ${x2},${y2}`;
            }
            
            path.setAttribute('d', d);
            path.setAttribute('stroke', color);
            path.setAttribute('stroke-width', '2');
            path.setAttribute('fill', 'none');
            
            if (isGlowing) {
                path.classList.add('svg-glow-line');
            }
            
            svg.appendChild(path);
        }

        // Draws every connector line (parent-child descent + spouse marriage
        // lines) as an SVG path from the currently-rendered cards' real positions.
        // Since cards are absolutely positioned (no DOM nesting), every edge needs
        // an explicit line — there's no "already adjacent in the DOM" case to skip.
        function drawCrossTreeLinks() {
            const svg = document.getElementById('cross-tree-links');
            if (!svg || !treeTransform) return;

            svg.innerHTML = '';

            const treeRect = treeTransform.getBoundingClientRect();
            if (currentZoom <= 0 || treeRect.width === 0) return;

            const nodeElements = {};
            document.querySelectorAll('.tree-node-card[data-id]').forEach(card => {
                nodeElements[card.getAttribute('data-id')] = card;
            });

            // Batch read bounding boxes to prevent layout thrashing and keep performance high
            const nodeRects = {};
            Object.values(nodeElements).forEach(card => {
                nodeRects[card.getAttribute('data-id')] = card.getBoundingClientRect();
            });

            const drawnSpouseLines = new Set();

            const getCenter = (rect) => ({
                x: (rect.left - treeRect.left) / currentZoom + rect.width / 2 / currentZoom,
                y: (rect.top - treeRect.top) / currentZoom + rect.height / 2 / currentZoom
            });
            const isGlowCard = (c) => c.classList.contains('highlighted') || c.classList.contains('highlighted-gen') || c.classList.contains('highlighted-spouse');

            Object.values(nodeElements).forEach(card => {
                const id = card.getAttribute('data-id');
                const cardRect = nodeRects[id];
                if (!cardRect || cardRect.width === 0 || cardRect.height === 0) return;

                const center = getCenter(cardRect);

                // Spouse (marriage) line — one per unique pair.
                const spouseIds = card.getAttribute('data-spouse-ids');
                if (spouseIds) {
                    spouseIds.split(',').forEach(sId => {
                        if (!sId) return;
                        const lineKey = [id, sId].sort().join('-');
                        if (drawnSpouseLines.has(lineKey)) return;

                        const spouseCard = nodeElements[sId];
                        if (!spouseCard) return;
                        drawnSpouseLines.add(lineKey);

                        const sRect = nodeRects[sId];
                        if (!sRect || sRect.width === 0 || sRect.height === 0) return;
                        const sCenter = getCenter(sRect);

                        const lineColor = personRootColor.get(Number(id)) || '#94a3b8';
                        const isGlowing = isGlowCard(card) && isGlowCard(spouseCard);
                        drawCrossLink(svg, center.x, center.y, sCenter.x, sCenter.y, 'spouse', lineColor, null, isGlowing);
                    });
                }

                // Parent-child descent line(s). When a child has exactly two
                // recorded parents and they're each other's spouse, treat the
                // couple as a single attachment point (their marriage line's
                // midpoint) instead of branching separately from each parent —
                // so the connector looks like one clean trunk fanning out to
                // however many children share it, the same as it would for an
                // only child, instead of a busier crossed pattern from two
                // independent parent branches landing on the same children.
                const parentIds = card.getAttribute('data-parent-ids');
                if (parentIds) {
                    const parentCards = parentIds.split(',').filter(Boolean)
                        .map(pId => nodeElements[pId]).filter(Boolean);

                    let attachPoints = [];
                    if (parentCards.length === 2) {
                        const [pA, pB] = parentCards;
                        const aId = pA.getAttribute('data-id');
                        const bId = pB.getAttribute('data-id');
                        const aSpouseIds = (pA.getAttribute('data-spouse-ids') || '').split(',');
                        const rA = nodeRects[aId];
                        const rB = nodeRects[bId];
                        if (aSpouseIds.includes(bId) && rA && rB && rA.width > 0 && rB.width > 0) {
                            const cA = getCenter(rA);
                            const cB = getCenter(rB);
                            attachPoints.push({
                                x: (cA.x + cB.x) / 2,
                                // Where the drawn line actually starts: the
                                // marriage line's own midpoint, not below the
                                // cards — otherwise the couple's X (which falls
                                // in the gap between their two cards) has nothing
                                // drawn between the marriage line and the trunk,
                                // leaving them visually disconnected even though
                                // they share an X.
                                startY: (cA.y + cB.y) / 2,
                                // Where the row "ends" for the purpose of
                                // centering the shared horizontal junction bar
                                // below — the actual bottom of the taller card,
                                // not the marriage line, so the bar sits centered
                                // in the real gap between the parent and child
                                // rows instead of hugging just under the parents.
                                rowBottomY: (Math.max(rA.bottom, rB.bottom) - treeRect.top) / currentZoom,
                                color: personRootColor.get(Number(aId)) || personRootColor.get(Number(bId)) || '#94a3b8',
                                glowing: isGlowCard(pA) && isGlowCard(pB),
                            });
                        }
                    }
                    if (attachPoints.length === 0) {
                        parentCards.forEach(pCard => {
                            const pId = pCard.getAttribute('data-id');
                            const pRect = nodeRects[pId];
                            if (!pRect || pRect.width === 0 || pRect.height === 0) return;
                            const bottomY = (pRect.bottom - treeRect.top) / currentZoom;
                            attachPoints.push({
                                x: getCenter(pRect).x,
                                startY: bottomY,
                                rowBottomY: bottomY,
                                color: personRootColor.get(Number(pId)) || '#94a3b8',
                                glowing: isGlowCard(pCard),
                            });
                        });
                    }

                    if (attachPoints.length > 0) {
                        const maxRowBottomY = Math.max(...attachPoints.map(a => a.rowBottomY));
                        const myTopY = (cardRect.top - treeRect.top) / currentZoom;
                        const sharedMidY = (maxRowBottomY + myTopY) / 2;

                        const lineColor = attachPoints[0].color;
                        const anyParentGlowing = attachPoints.some(a => a.glowing);
                        const childIsGlowing = card.classList.contains('highlighted') || card.classList.contains('highlighted-gen');
                        const isGlowingPath = anyParentGlowing && childIsGlowing;

                        attachPoints.forEach(a => {
                            drawCrossLink(svg, a.x, a.startY, center.x, myTopY, 'parent-child', lineColor, sharedMidY, isGlowingPath && a.glowing);
                        });
                    }
                }
            });
        }

        // Fetch Data and Render Tree Logic
        async function loadAndRenderTree() {
            try {
                // Initialize sql.js WebAssembly
                const SQL = await initSqlJs({
                    locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
                });

                const dbFileName = 'data.sqlite';
                // Add a cache-busting timestamp to prevent the browser from serving a stale cached file
                const response = await fetch(`${dbFileName}?t=${Date.now()}`);
                if (!response.ok) {
                    throw new Error(`Failed to load ${dbFileName} (${response.status}: ${response.statusText}). Note: Browsers block fetch requests on the file:// protocol. Please serve this folder using a local web server.`);
                }
                
                // Read the database file into memory
                const buffer = await response.arrayBuffer();
                const db = new SQL.Database(new Uint8Array(buffer));

                // Query the database
                const peopleStmt = db.prepare("SELECT * FROM People");
                const people = [];
                while (peopleStmt.step()) {
                    people.push(peopleStmt.getAsObject());
                }
                peopleStmt.free();

                const spousesStmt = db.prepare("SELECT * FROM Spouses");
                const spouses = [];
                while (spousesStmt.step()) {
                    spouses.push(spousesStmt.getAsObject());
                }
                spousesStmt.free();

                const parentsStmt = db.prepare("SELECT * FROM Parents");
                const parents = [];
                while (parentsStmt.step()) {
                    parents.push(parentsStmt.getAsObject());
                }
                parentsStmt.free();

                db.close();
                
                const parsed = people.map(person => {
                    const spouseIds = spouses
                        .filter(s => s.spouse1Id === person.id || s.spouse2Id === person.id)
                        .map(s => s.spouse1Id === person.id ? s.spouse2Id : s.spouse1Id);

                    const parentIds = parents
                        .filter(p => p.childId === person.id)
                        .flatMap(p => [p.parent1Id, p.parent2Id])
                        .filter(id => id != null);

                    return { ...person, spouseIds, parentIds };
                });

                let roots = [];
                // Detect if data is a flat SQL export instead of a tree
                const isFlatSqlData = Array.isArray(parsed) && parsed.length > 0 && 'id' in parsed[0];
                if (isFlatSqlData) {
                    roots = buildHierarchy(parsed);
                } else {
                    roots = Array.isArray(parsed) ? parsed : [parsed];
                }
                originalRoots = roots;

                // Build Tree
                await renderTreeFromHierarchy(roots);
                errorOverlay.classList.add('hidden');

                // Show generation legend
                generationLegend.classList.remove('hidden');
                generationLegend.classList.add('flex');

                if (minimapWrapper) {
                    minimapWrapper.classList.remove('hidden');
                    minimapWrapper.classList.add('flex');
                }

                // Dynamically populate Color Legend based on actual generations in the tree
                let maxGen = 1;
                document.querySelectorAll('.tree-node-card[data-generation]').forEach(card => {
                    const gen = parseInt(card.getAttribute('data-generation')) || 1;
                    if (gen > maxGen) maxGen = gen;
                });
                
                legendList.innerHTML = '';
                for (let i = 1; i <= maxGen; i++) {
                    const color = generationColors[(i - 1) % generationColors.length];
                    legendList.innerHTML += `
                        <div class="flex items-center gap-2 p-1.5 -mx-1.5 rounded-md cursor-pointer hover:bg-slate-100 transition-colors legend-item" data-gen="${i}" title="Bu jenerasyondaki herkesi vurgula">
                            <div class="w-3 h-3 rounded-full flex-shrink-0 border border-slate-200 shadow-sm" style="background-color: ${color.hex}"></div>
                            <span class="truncate">${i}. Nesil</span>
                        </div>`;
                }
                
                const legendNote = document.getElementById('legend-note');
                if (legendNote) {
                    if (maxGen > 15) legendNote.classList.remove('hidden');
                    else legendNote.classList.add('hidden');
                }

                // Call update on initial render to calculate base physical bounds
                updateZoomStyle();

                // Delay scrolling until the browser has finished painting the initial layout.
                // This ensures getBoundingClientRect() returns the final, correct positions.
                setTimeout(() => {
                    const targetCard = document.querySelector('.tree-node-card');

                    if (targetCard) {
                        const cardRect = targetCard.getBoundingClientRect();
                        const treeRect = treeTransform.getBoundingClientRect();
                        const containerRect = scrollContainer.getBoundingClientRect();
                        
                        // Center the card in the viewport
                        const cardCenterX = (cardRect.left - treeRect.left) + (cardRect.width / 2);
                        const cardCenterY = (cardRect.top - treeRect.top) + (cardRect.height / 2);
                        
                        scrollContainer.scrollLeft = cardCenterX - (containerRect.width / 2);
                        scrollContainer.scrollTop = cardCenterY - (containerRect.height / 2);
                    } else {
                        // Fallback to centering the whole tree if no card is found
                        scrollContainer.scrollLeft = (scrollContainer.scrollWidth - scrollContainer.clientWidth) / 2;
                        scrollContainer.scrollTop = 0;
                    }
                }, 100);

                // Slight delay to ensure layout is physically finished before rendering minimap
                setTimeout(drawMinimap, 100);

            } catch (err) {
                errorText.textContent = err.message;
                errorOverlay.classList.remove('hidden');
                
                // Show error state in the tree area
                treeRoot.innerHTML = `
                    <div class="text-slate-400 flex flex-col items-center mt-20">
                        <i data-lucide="alert-circle" class="w-12 h-12 mb-4 opacity-20"></i>
                        <p>No valid tree data to display.</p>
                    </div>
                `;
                lucide.createIcons();
            }
        }

        // Zoom Functions
        function updateZoomStyle(newScrollLeft = null, newScrollTop = null) {
            // Calculate and explicitly set the wrapper's physical dimensions.
            // IMPORTANT: Read offsetWidth/Height BEFORE setting style.transform to avoid synchronous reflows!
            const unscaledWidth = treeTransform.offsetWidth;
            const unscaledHeight = treeTransform.offsetHeight;
            
            treeTransform.style.transform = `scale(${currentZoom})`;
            
            const wrapper = document.getElementById('scale-wrapper');
            if (wrapper) {
                wrapper.style.width = `${unscaledWidth * currentZoom}px`;
                wrapper.style.height = `${unscaledHeight * currentZoom}px`;
            }

            if (newScrollLeft !== null && newScrollTop !== null) {
                scrollContainer.scrollLeft = newScrollLeft;
                scrollContainer.scrollTop = newScrollTop;
            }
            
            updateMinimapViewport();
        }

        function applyZoomFromCenter(newZoom) {
            const oldZoom = currentZoom;
            if (newZoom === oldZoom) return;
            
            currentZoom = newZoom;
            
            // Calculate center of the viewport
            const centerX = scrollContainer.clientWidth / 2;
            const centerY = scrollContainer.clientHeight / 2;
            
            // Calculate new scroll position to keep the center stationary
            const zoomRatio = currentZoom / oldZoom;
            const newScrollLeft = (scrollContainer.scrollLeft + centerX) * zoomRatio - centerX;
            const newScrollTop = (scrollContainer.scrollTop + centerY) * zoomRatio - centerY;
            
            updateZoomStyle(newScrollLeft, newScrollTop);
        }

        btnZoomIn.addEventListener('click', () => {
            applyZoomFromCenter(Math.min(currentZoom + 0.2, 2));
        });

        btnZoomOut.addEventListener('click', () => {
            applyZoomFromCenter(Math.max(currentZoom - 0.2, 0.05));
        });

        btnZoomReset.addEventListener('click', () => {
            if (isFocusMode) {
                fitTreeToScreen();
            } else {
                applyZoomFromCenter(1);
            }
        });

        function fitTreeToScreen() {
            const treeW = treeTransform.offsetWidth;
            const treeH = treeTransform.offsetHeight;
            
            if (treeW === 0 || treeH === 0) return;

            const viewW = scrollContainer.clientWidth;
            const viewH = scrollContainer.clientHeight;
            
            const padding = 80; // 40px each side
            let newZoom = Math.min((viewW - padding) / treeW, (viewH - padding) / treeH);
            currentZoom = Math.max(0.05, Math.min(newZoom, 1.2)); // Cap scale to not over-blow small trees
            
            updateZoomStyle();
            scrollContainer.scrollLeft = (scrollContainer.scrollWidth - scrollContainer.clientWidth) / 2;
            scrollContainer.scrollTop = (scrollContainer.scrollHeight - scrollContainer.clientHeight) / 2;
        }

        // Snapshot current .highlighted/.highlighted-gen/.highlighted-spouse cards
        // (by id) so the state can be re-applied after a re-render replaces the DOM.
        function captureHighlightState() {
            const state = new Map();
            document.querySelectorAll('.tree-node-card.highlighted, .tree-node-card.highlighted-gen, .tree-node-card.highlighted-spouse').forEach(card => {
                const id = Number(card.getAttribute('data-id'));
                const cls = card.classList.contains('highlighted') ? 'highlighted'
                    : card.classList.contains('highlighted-gen') ? 'highlighted-gen'
                    : 'highlighted-spouse';
                state.set(id, {
                    cls,
                    color: card.style.getPropertyValue('--highlight-color'),
                    shadow: card.style.getPropertyValue('--highlight-shadow'),
                });
            });
            return state;
        }

        function applyHighlightState(state) {
            document.querySelectorAll('.tree-node-card[data-id]').forEach(card => {
                const info = state.get(Number(card.getAttribute('data-id')));
                if (!info) return;
                card.classList.add(info.cls);
                if (info.color) card.style.setProperty('--highlight-color', info.color);
                if (info.shadow) card.style.setProperty('--highlight-shadow', info.shadow);
            });
        }

        async function toggleFocusMode(forceState) {
            if (typeof forceState === 'boolean') {
                if (isFocusMode === forceState) return;
                isFocusMode = forceState;
            } else {
                isFocusMode = !isFocusMode;
            }

            if (btnFocus) {
                if (isFocusMode) {
                    btnFocus.classList.add('bg-blue-50', 'text-blue-600');
                    btnFocus.classList.remove('text-slate-600');
                } else {
                    btnFocus.classList.remove('bg-blue-50', 'text-blue-600');
                    btnFocus.classList.add('text-slate-600');
                }
            }

            // Snapshot which cards are currently highlighted (and how) before
            // re-rendering wipes the DOM — re-applied to the fresh cards below.
            const highlightState = captureHighlightState();

            if (isFocusMode) {
                if (highlightState.size === 0) {
                    isFocusMode = false;
                    if (btnFocus) {
                        btnFocus.classList.remove('bg-blue-50', 'text-blue-600');
                        btnFocus.classList.add('text-red-500');
                        setTimeout(() => {
                            btnFocus.classList.remove('text-red-500');
                            btnFocus.classList.add('text-slate-600');
                        }, 500);
                    }
                    return;
                }

                // Re-render with only the highlighted bloodline (and whatever
                // structural ancestors are needed to connect them) instead of
                // hiding/showing DOM nodes in place.
                const visibleIds = new Set(highlightState.keys());
                await renderTreeFromHierarchy(pruneForFocus(originalRoots, visibleIds));
            } else {
                await renderTreeFromHierarchy(originalRoots);
            }

            applyHighlightState(highlightState);
            drawCrossTreeLinks();

            setTimeout(() => {
                if (isFocusMode) {
                    updateZoomStyle(); // re-eval physical dimensions for the wrapper
                    fitTreeToScreen();
                } else {
                    currentZoom = 1;
                    updateZoomStyle();
                    
                    const targetCard = document.querySelector('.tree-node-card.highlighted');
                    if (targetCard) {
                        const cardRect = targetCard.getBoundingClientRect();
                        const treeRect = treeTransform.getBoundingClientRect();
                        const containerRect = scrollContainer.getBoundingClientRect();
                        
                        const cardCenterX = (cardRect.left - treeRect.left) + (cardRect.width / 2);
                        const cardCenterY = (cardRect.top - treeRect.top) + (cardRect.height / 2);
                        
                        scrollContainer.scrollLeft = cardCenterX - (containerRect.width / 2);
                        scrollContainer.scrollTop = cardCenterY - (containerRect.height / 2);
                    }
                }
                drawMinimap();
            }, 50);
        }

        if (btnFocus) {
            btnFocus.addEventListener('click', () => toggleFocusMode());
        }

        // Zoom the tree around the cursor, keeping whatever's under the pointer stationary.
        function applyWheelZoom(e, isZoomingIn, zoomDelta) {
            const oldZoom = currentZoom;
            currentZoom = isZoomingIn ? Math.min(currentZoom + zoomDelta, 2) : Math.max(currentZoom - zoomDelta, 0.05);

            if (currentZoom !== oldZoom) {
                const rect = scrollContainer.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const zoomRatio = currentZoom / oldZoom;
                const newScrollLeft = (scrollContainer.scrollLeft + mouseX) * zoomRatio - mouseX;
                const newScrollTop = (scrollContainer.scrollTop + mouseY) * zoomRatio - mouseY;

                updateZoomStyle(newScrollLeft, newScrollTop);
            }
        }

        scrollContainer.addEventListener('wheel', (e) => {
            // Trackpad pinch gesture: browsers report this as a wheel event with
            // ctrlKey set to true, with small/fractional deltaY as the fingers move.
            // Someone actually holding Ctrl while turning a physical mouse wheel gets
            // the same ctrlKey flag, but with large "steppy" integer deltas — treat
            // only the former as zoom, and let the latter just scroll like normal.
            if (e.ctrlKey && (!Number.isInteger(e.deltaY) || Math.abs(e.deltaY) < 50)) {
                e.preventDefault();
                applyWheelZoom(e, e.deltaY < 0, Math.abs(e.deltaY) * 0.01);
                return;
            }

            // Shift+scroll (mouse wheel or trackpad): an explicit request to zoom.
            if (e.shiftKey) {
                e.preventDefault();
                applyWheelZoom(e, e.deltaY < 0, 0.1);
                return;
            }

            // No modifier: let the browser scroll/pan natively — both a trackpad's
            // two-finger scroll and a plain mouse wheel behave the same way here.
        }, { passive: false }); // Passive must be false to allow preventDefault()

        // Drag to scroll functionality
        let isDragging = false;
        let startX, startY, initialScrollLeft, initialScrollTop;

        scrollContainer.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return; // Only allow left click
            isDragging = true;
            scrollContainer.classList.add('cursor-grabbing');
            scrollContainer.classList.remove('cursor-grab');
            scrollContainer.style.userSelect = 'none'; // Prevent text selection while dragging
            
            startX = e.pageX - scrollContainer.offsetLeft;
            startY = e.pageY - scrollContainer.offsetTop;
            initialScrollLeft = scrollContainer.scrollLeft;
            initialScrollTop = scrollContainer.scrollTop;
        });

        const stopDragging = () => {
            isDragging = false;
            scrollContainer.classList.remove('cursor-grabbing');
            scrollContainer.classList.add('cursor-grab');
            scrollContainer.style.userSelect = '';
        };

        scrollContainer.addEventListener('mouseleave', stopDragging);
        scrollContainer.addEventListener('mouseup', stopDragging);

        scrollContainer.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            e.preventDefault(); // Prevent default browser drag behavior
            
            const x = e.pageX - scrollContainer.offsetLeft;
            const y = e.pageY - scrollContainer.offsetTop;
            const walkX = x - startX;
            const walkY = y - startY;
            
            // Adjust the scroll position
            scrollContainer.scrollLeft = initialScrollLeft - walkX;
            scrollContainer.scrollTop = initialScrollTop - walkY;
        });

        // Minimap Drawing and Interaction
        function drawMinimap() {
            if (!minimapContainer || !minimapCanvas) return;
            const ctx = minimapCanvas.getContext('2d');
            
            minimapCanvas.width = minimapContainer.clientWidth;
            minimapCanvas.height = minimapContainer.clientHeight;
            
            const treeRect = treeTransform.getBoundingClientRect();
            const treeWidth = treeRect.width / currentZoom;
            const treeHeight = treeRect.height / currentZoom;
            
            if (treeWidth === 0 || treeHeight === 0) return;

            const padding = 10; 
            const scaleX = (minimapCanvas.width - padding * 2) / treeWidth;
            const scaleY = (minimapCanvas.height - padding * 2) / treeHeight;
            const minimapScale = Math.min(scaleX, scaleY);
            
            const offsetX = (minimapCanvas.width - treeWidth * minimapScale) / 2;
            const offsetY = (minimapCanvas.height - treeHeight * minimapScale) / 2;
            
            ctx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);
            minimapContainer._metrics = { minimapScale, offsetX, offsetY, treeWidth, treeHeight };
            
            document.querySelectorAll('.tree-node-card').forEach(card => {
                const rect = card.getBoundingClientRect();
                const x = (rect.left - treeRect.left) / currentZoom;
                const y = (rect.top - treeRect.top) / currentZoom;
                const w = rect.width / currentZoom;
                const h = rect.height / currentZoom;
                
                if (card.classList.contains('highlighted') || card.classList.contains('highlighted-gen') || card.classList.contains('highlighted-spouse')) {
                    ctx.fillStyle = card.style.getPropertyValue('--highlight-color').trim() || '#3b82f6';
                } else {
                    ctx.fillStyle = '#475569'; // Darker slate for better contrast
                }
                ctx.fillRect(offsetX + x * minimapScale, offsetY + y * minimapScale, w * minimapScale, h * minimapScale);
            });
            
            updateMinimapViewport();
        }

        function updateMinimapViewport() {
            if (!minimapContainer || !minimapViewport || !minimapContainer._metrics) return;
            const metrics = minimapContainer._metrics;
            minimapViewport.style.display = 'block';
            
            const scrollRect = scrollContainer.getBoundingClientRect();
            const treeRect = treeTransform.getBoundingClientRect();
            
            const visibleLeftOnTree = scrollRect.left - treeRect.left;
            const visibleTopOnTree = scrollRect.top - treeRect.top;
            
            const unscaledScrollX = visibleLeftOnTree / currentZoom;
            const unscaledScrollY = visibleTopOnTree / currentZoom;
            const unscaledVisibleW = scrollRect.width / currentZoom;
            const unscaledVisibleH = scrollRect.height / currentZoom;
            
            let mapX = metrics.offsetX + unscaledScrollX * metrics.minimapScale;
            let mapY = metrics.offsetY + unscaledScrollY * metrics.minimapScale;
            let mapW = unscaledVisibleW * metrics.minimapScale;
            let mapH = unscaledVisibleH * metrics.minimapScale;
            
            minimapViewport.style.left = `${mapX}px`;
            minimapViewport.style.top = `${mapY}px`;
            minimapViewport.style.width = `${mapW}px`;
            minimapViewport.style.height = `${mapH}px`;
        }

        scrollContainer.addEventListener('scroll', updateMinimapViewport);
        window.addEventListener('resize', drawMinimap);

        // Node selection and bloodline highlighting logic
        treeRoot.addEventListener('click', (e) => {
            if (isFocusMode) return;
            
            const card = e.target.closest('.tree-node-card');
            if (!card) return;
            
            const isAlreadyHighlighted = card.classList.contains('highlighted');
            
            // Clear previous highlights
            document.querySelectorAll('.tree-node-card.highlighted, .tree-node-card.highlighted-gen, .tree-node-card.highlighted-spouse').forEach(el => {
                el.classList.remove('highlighted', 'highlighted-gen', 'highlighted-spouse');
                el.style.removeProperty('--highlight-color');
                el.style.removeProperty('--highlight-shadow');
            });
            
            document.querySelectorAll('.glow-line, .glow-up, .glow-down, .glow-horizontal, .glow-horizontal-left, .glow-horizontal-right').forEach(el => {
                el.classList.remove('glow-line', 'glow-up', 'glow-down', 'glow-horizontal', 'glow-horizontal-left', 'glow-horizontal-right');
            });
            
            // Menüdeki (legend) aktif seçimi de temizle
            document.querySelectorAll('.legend-item').forEach(el => {
                el.classList.remove('active-legend', 'bg-slate-100', 'font-semibold', 'text-slate-900');
            });
            
            personDetailsPanel.classList.add('hidden');
            personDetailsPanel.classList.remove('flex');
            
            // Highlight logic (toggles off if clicking the currently highlighted card)
            if (!isAlreadyHighlighted) {
                card.classList.add('highlighted');
                
                const gen = parseInt(card.getAttribute('data-generation')) || 1;
                const len = generationColors.length;
                const colorIndex = ((gen - 1) % len + len) % len; // Safe modulo for negative numbers
                const colorObj = generationColors[colorIndex];
                card.style.setProperty('--highlight-color', colorObj.hex);
                card.style.setProperty('--highlight-shadow', `0 0 0 4px ${colorObj.rgba}`);
                
                const detailsStr = card.getAttribute('data-details');
                if (detailsStr) {
                    try {
                        const details = JSON.parse(detailsStr);
                        const name = details.name || "UNKNOWN";
                        const surname = (details.attributes && details.attributes.surname) ? details.attributes.surname : '';
                        
                        let detailsHTML = '';
                        if (details.photoUrl) {
                            detailsHTML += `<img src="${escapeHTML(details.photoUrl)}" alt="Portrait" class="w-16 h-16 rounded-full object-cover mx-auto mb-2 border-2 border-slate-100 shadow-sm shrink-0">`;
                        } else {
                            detailsHTML += `<div class="w-16 h-16 rounded-full bg-slate-50 mx-auto mb-2 flex items-center justify-center border-2 border-slate-100 shadow-sm shrink-0"><i data-lucide="user" class="w-8 h-8 text-slate-300"></i></div>`;
                        }
